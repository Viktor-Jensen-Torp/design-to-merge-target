# The implementer. Label an issue, get a draft pull request.
#
# Goes in the TARGET repo at .github/workflows/implement.yml.
#
# Requires, in the target repo:
#   vars.IMPLEMENTER_CLIENT_ID the implementer GitHub App's Client ID
#   secrets.IMPLEMENTER_APP_PRIVATE_KEY   its private key, whole file
#   secrets.OPENROUTER_API_KEY
#   vars.IMPLEMENT_MODEL
#   scripts/pi-driver.py          the finish gate (from this repo's target/scripts/)
#   .agents/nudge-implementer.md  what the gate says when it is not satisfied

name: Implement

on:
  issues:
    types: [labeled]

# A single shared group would DROP work: at most one run executes and one pends,
# and each new arrival cancels the pending one. Five labelled issues would give
# two runs and three silent cancellations. See NOTES.md section 5.
#
# One group per issue. Implementation is parallel by design (PRD, "Parallel
# implement, queued merge"). Merging is NOT serialised here or in review.yml —
# `develop` requires a merge queue and GitHub serialises for us (`0010`).
concurrency:
  group: implement-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    if: github.event.label.name == 'active:agent'
    runs-on: ubuntu-latest
    # An App installation token expires after one hour (NOTES.md section 9).
    # Do not raise this past ~55 without re-minting the token mid-job.
    timeout-minutes: 45

    steps:
      # A GITHUB_TOKEN-opened pull request produces CI runs in an
      # approval-required state, so review.yml would never fire — silently.
      # GITHUB_TOKEN-authored events also do not chain at all. NOTES.md 6.
      - name: Mint the implementer token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IMPLEMENTER_CLIENT_ID }}
          private-key: ${{ secrets.IMPLEMENTER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      # ADR 0002 — dependency changes are human work. Refuse before spending a
      # token rather than after reading a diff.
      # There is deliberately NO text check on the issue body for dependency work.
      #
      # There used to be: a grep for bump|upgrade|dependenc|lockfile|package.json.
      # On the first real issue it refused one whose body said "**No new
      # dependencies.**" — prose cannot distinguish an issue that NEEDS a
      # dependency from one that FORBIDS one, and the well-written issue is the
      # one that says the word (`NOTES.md` section 21).
      #
      # ADR 0002 is unchanged; only where it is enforced has moved. The
      # authoritative gate is the diff, in `review.yml`'s deterministic risk
      # check: any change touching package.json or pnpm-lock.yaml escalates to a
      # human without spending a model. That gate cannot be fooled by wording,
      # and it catches the case this one missed — an issue that needs a
      # dependency without ever using the word.

      # The agent commits, so git needs an identity. Without one its first
      # `git commit` fails with "Author identity unknown", and on 2026-09-16 the
      # implementer recovered by inventing one — every commit on that branch is
      # authored by `Agent <you@example.com>` (`NOTES.md` 45). The work was
      # right and the authorship was a placeholder, which is worse than a
      # failure: it is wrong and it looks fine.
      #
      # The App's own bot identity is the honest answer. It is what GitHub
      # attributes the push to anyway, and it makes `git log` say which role
      # wrote a commit.
      - name: Give the agent the App's identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id) \
            || { echo "::error::could not resolve the bot user id for ${SLUG}"; exit 1; }
          git config user.name  "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          echo "commits will be authored by ${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>"

      # Zone 1 gates. An unconfigured hook is indistinguishable from a passing
      # one, so assert rather than assume — this was missed twice on Hermes.
      - name: Arm the local gates
        run: |
          git config core.hooksPath .githooks
          test "$(git config core.hooksPath)" = ".githooks"
          test -x .githooks/pre-commit
          test -x .githooks/pre-push

      # `v7`, not `v5`. `setup-node@v5` auto-caches whatever `packageManager`
      # in `package.json` names, and this job has a full checkout and no pnpm —
      # `pnpm store path` fails and `core.setFailed` takes the job with it.
      # `v6` limited auto-caching to npm, which is why the jump skips a major.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent

      # THE ONE STACK-SPECIFIC BLOCK. Change it with `ci.yml` when the project
      # is not pnpm.
      #
      # Without it the agent has no node_modules, so it cannot run a single
      # gate. On the first real run it discovered that, and then tried `npm
      # install`, `yarn install` and `corepack prepare` in turn — trying to
      # install its way out. `AGENTS.md`'s loudest rule is "do not change
      # dependencies", and the environment had made obeying it impossible
      # (`NOTES.md` section 23). An agent that cannot verify its own work will
      # do whatever it takes to be able to.
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Assert the toolchain is actually there
        run: |
          test -d node_modules || { echo "::error::no node_modules after install"; exit 1; }
          pnpm exec tsc --version >/dev/null || { echo "::error::toolchain not runnable"; exit 1; }
          python3 --version >/dev/null || { echo "::error::no python3 for the driver"; exit 1; }
          test -x scripts/pi-driver.py || { echo "::error::scripts/pi-driver.py missing"; exit 1; }
          # `.pi/extensions/` is auto-discovered, which means a missing file is
          # silent: the run proceeds with no submit tool and the role's
          # instruction to call it becomes an instruction to call nothing.
          test -s .pi/extensions/submit.ts \
            || { echo "::error::.pi/extensions/submit.ts missing — the role is told to call submit_implementation"; exit 1; }
          test -s .pi/extensions/protect.ts \
            || { echo "::error::.pi/extensions/protect.ts missing — the root of trust is unguarded in-loop"; exit 1; }
          test -s .pi/extensions/sanity.ts \
            || { echo "::error::.pi/extensions/sanity.ts missing — corrupted tool arguments would go unnoticed"; exit 1; }
          test -s .pi/extensions/debug.ts \
            || { echo "::error::.pi/extensions/debug.ts missing"; exit 1; }

      # The agent is GIVEN the issue. It is not asked to find it.
      #
      # `.agents/implementer.md` used to say "run gh issue view". On the first
      # real run the model read that file and did not do it, then spent 46 tool
      # calls guessing — git log --grep "4", then "issue", then "slug", then a
      # grep for TODO across node_modules. Nothing failed; it just never learned
      # what to build (`NOTES.md` section 23).
      #
      # A step the agent may skip is not a gate. `rework.yml` already gathers
      # its context this way; this is the same pattern, applied where it was
      # missing.
      - name: Gather the issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue view "$N" --repo "$REPO" --json title,body,comments --jq '
            "# " + .title + "\n\n" + (.body // "")
            + (if (.comments | length) > 0
               then "\n\n## Comments on the issue\n\n"
                    + ([.comments[] | "**" + .author.login + "** wrote:\n\n" + .body] | join("\n\n---\n\n"))
               else "" end)
          ' > "$RUNNER_TEMP/issue.md"
          test -s "$RUNNER_TEMP/issue.md" \
            || { echo "::error::issue #$N came back empty — refusing to run an agent with no brief"; exit 1; }
          echo "issue brief: $(wc -c < "$RUNNER_TEMP/issue.md") bytes"

      - name: Work the issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Read by .pi/extensions/submit.ts to decide which submit tool to
          # register, and by the tool to know what to compare the branch against.
          PI_ROLE: implementer
          PI_BASE_REF: origin/develop
          # No update check, no telemetry, on every run.
          PI_OFFLINE: "1"
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          git switch -c "agent/issue-$N"

          # Built in a file, so nothing in the issue body is re-parsed by the
          # shell on its way to the model.
          {
            printf 'Implement issue #%s in %s.\n\n' "$N" "$REPO"
            printf 'The issue is reproduced below IN FULL. Do not go looking for it —\n'
            printf 'you already have it. Its acceptance criteria are what you are judged on.\n\n'
            printf -- '----- BEGIN ISSUE #%s -----\n' "$N"
            cat "$RUNNER_TEMP/issue.md"
            printf -- '\n----- END ISSUE #%s -----\n\n' "$N"
            printf 'Write your plan to %s/plan.md before you write any code.\n' "$RUNNER_TEMP"
            printf 'It becomes the pull request body.\n'
          } > "$RUNNER_TEMP/prompt.md"

          # Two channels, doing two jobs (NOTES.md section 2):
          #
          #   --approve      lets .pi/settings.json load at all. Without it,
          #                  project config is silently ignored in CI.
          #   --append-system-prompt
          #                  carries the part that must differ per role. The
          #                  reviewer never sees this file, and this role never
          #                  sees the reviewer's. On Hermes the reviewer read an
          #                  instruction meant for the implementer and refused
          #                  to merge, twice.
          #
          #                  This was `--skill`, and that was a SILENT NO-OP. A
          #                  Pi skill is a DIRECTORY holding SKILL.md with
          #                  name/description frontmatter; only the description
          #                  reaches the system prompt, and the body is loaded
          #                  on demand — Pi's own docs say "models don't always
          #                  do this". A bare .md path registered nothing and
          #                  warned about nothing. Two agent runs executed with
          #                  no role instructions at all (`NOTES.md` 25). This
          #                  is what Hermes did with its per-profile YAML:
          #                  role instructions as a stable system block.
          #
          # The role's instructions are in .agents/implementer.md, not here.
          # Keeping them in one place is the point: an instruction duplicated in
          # two places is an instruction that will disagree with itself.
          # Refuse to run an agent with no role instructions. `--skill` used to
          # fail silently here and two runs went out with none (`NOTES.md` 25).
          test -s .agents/implementer.md \
            || { echo "::error::.agents/implementer.md is missing or empty"; exit 1; }
          test -s .agents/nudge-implementer.md \
            || { echo "::error::.agents/nudge-implementer.md is missing or empty"; exit 1; }
          echo "role instructions: $(wc -c < .agents/implementer.md) bytes"

          # WHEN IS THE IMPLEMENTER FINISHED?
          #
          # A clean tree ALONE is not the answer — it is true at checkout, before
          # the agent has done anything, so on its own it is a gate that is green
          # before the work starts. The answer is a clean tree AND work on the
          # branch (`NOTES.md` 27).
          #
          # This script's OUTPUT is what the agent is shown when it stops early,
          # so it reports state rather than repeating the role file.
          cat > "$RUNNER_TEMP/done.sh" <<'DONE'
          # Asking for a human is a valid ending, not a failure. Without this
          # the driver would nudge an agent that had already decided it needed a
          # decision it is not allowed to make, twice, and then go red.
          if [ -s "$RUNNER_TEMP/needs-human.md" ]; then
            echo "The agent asked for a human."
            exit 0
          fi
          st=$(git status --porcelain)
          ahead=$(git rev-list --count origin/develop..HEAD)
          [ -n "$st" ] && { echo "Uncommitted changes in the working tree:"; echo "$st"; }
          [ "$ahead" = 0 ] && echo "No commits on this branch beyond origin/develop."
          [ -z "$st" ] && [ "$ahead" -gt 0 ]
          DONE

          # `pi --mode rpc` plus a driver, NOT `pi --mode json`.
          #
          # `pi -p` exits 0 when the task fails and `--mode json` never checks
          # the stop reason (`NOTES.md` 1), so every previous version of this
          # step was a gate that could not go red. Three runs implemented the
          # issue correctly, stopped without committing, and reported success.
          #
          # scripts/pi-driver.py owns the loop and the exit code: it waits for
          # `agent_settled`, runs done.sh, and either finishes or gives the agent
          # another turn, up to --max-nudges. It exits 1 when the budget runs out
          # and 2 on a timeout, which is what makes `if: failure()` below mean
          # anything at all.
          #
          # --idle-timeout is the answer to a provider that simply hangs; the
          # first real run sat twenty minutes on a free model with the job
          # timeout as its only backstop. Both driver timeouts are set below the
          # job's 45 minutes so the driver, not the runner, reports the failure.
          #
          # 2280s, not 2100s. Setup costs about three minutes and publishing
          # about one, so 38 minutes is what is actually spare — and a run has
          # already been killed with the work finished but uncommitted
          # (`NOTES.md` 40). The real fix for that is in the role file: the
          # gates passing is the end of the work. This only stops the clock
          # being the thing that decides.
          #
          # Everything the model says and every tool it calls is streamed to this
          # job's log as it happens.
          # --no-skills: the human skills in .agents/skills/ (`0015`) are for people's
          # harnesses. Pi discovers that directory by itself, and without the flag
          # every role would carry them in its system prompt on every run.
          # --provider openrouter: `--model` reads `provider/id`, so a model whose
          # prefix is also a Pi provider (`deepseek/`, `google/`, `openai/`) goes to
          # that provider instead, and dies asking for its key (`NOTES.md` 70).
          python3 scripts/pi-driver.py \
            --prompt-file "$RUNNER_TEMP/prompt.md" \
            --nudge-file .agents/nudge-implementer.md \
            --done "bash $RUNNER_TEMP/done.sh" \
            --max-nudges 2 \
            --idle-timeout 600 \
            --timeout 2280 \
            --log "$RUNNER_TEMP/rpc.jsonl" \
            -- pi --mode rpc --approve --no-skills --provider openrouter \
                  --append-system-prompt "$(cat .agents/implementer.md)" \
                  --model "${{ vars.IMPLEMENT_MODEL }}"

      # Cheap and local. review.yml escalates a dependency diff to a human, but
      # that costs a whole round trip to say something knowable here.
      - name: Assert the agent left the dependencies alone
        run: |
          if ! git diff --quiet HEAD -- package.json pnpm-lock.yaml; then
            echo "::error::the agent changed package.json or pnpm-lock.yaml (ADR 0002)"
            git --no-pager diff --stat HEAD -- package.json pnpm-lock.yaml
            exit 1
          fi

      # ADR 0006 says silence is never an outcome for the reviewer. The same has
      # to be true of an implementer that decides it is out of its depth — and
      # until now it had no verb for that: only a FAILED run escalated, so an
      # agent that stopped deliberately and an agent that broke looked the same.
      #
      # The reason goes in a COMMENT, next to the label. A person should arrive
      # at the agent's reasoning, not at a job whose logs they have to open —
      # and logs expire.
      - name: Did the agent ask for a human?
        id: askhuman
        run: |
          if [ -s "$RUNNER_TEMP/needs-human.md" ]; then
            echo "asked=true" >> "$GITHUB_OUTPUT"
            echo "the agent asked for a human: $(wc -c < "$RUNNER_TEMP/needs-human.md") bytes"
          else
            echo "asked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand it to a human
        if: steps.askhuman.outputs.asked == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The implementer stopped and asked for a human. Its reason:"
            echo
            sed 's/^/> /' "$RUNNER_TEMP/needs-human.md"
            echo
            echo "No pull request was opened. This is a deliberate stop, not a failed"
            echo "run — it spends no attempt. $RUN"
          } > "$RUNNER_TEMP/handover.md"
          gh issue comment "$N" --repo "$REPO" --body-file "$RUNNER_TEMP/handover.md"
          gh issue edit "$N" --repo "$REPO" --add-label needs:human --remove-label active:agent
          echo "issue #$N -> needs:human"

      # There is deliberately no "assert the agent did something" step here any
      # more. It used to re-run `git diff --quiet origin/develop..HEAD` and grep
      # the JSON stream for a stop reason. The driver's done.sh is now that
      # check, it runs while the agent can still act on it, and a check written
      # in two places is a check that will eventually disagree with itself.

      # The whole RPC event stream, for reading a failure without re-running it.
      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpc-issue-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/rpc.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Publish the work
        if: steps.askhuman.outputs.asked != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          N: ${{ github.event.issue.number }}
        run: |
          BRANCH="agent/issue-$N"
          git push -u origin "$BRANCH"

          # A commit is not delivered until it is on the remote. The Hermes run
          # that cost the most was an implementer reporting work it had only
          # committed locally, which the reviewer then read and approved.
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "$BRANCH" | cut -f1)
          test "$LOCAL" = "$REMOTE" || {
            echo "Local HEAD $LOCAL does not match remote $REMOTE."
            exit 1
          }

          # ADR 0007 — the plan lives in the pull request body and nowhere
          # else. Not a committed file, so it cannot outlive the change and
          # become a document a later implementer believes.
          {
            echo "## Plan"
            echo
            if [ -s "$RUNNER_TEMP/plan.md" ]; then
              cat "$RUNNER_TEMP/plan.md"
            else
              echo "_The agent wrote no plan. Review the diff against the issue only,"
              echo "and treat the omission as a finding._"
            fi
            echo
            echo "---"
            echo
            echo "Closes #$N"
            echo
            echo "Head at open: $LOCAL"
          } > "$RUNNER_TEMP/body.md"

          gh pr create --draft --base develop \
            --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s)" \
            --body-file "$RUNNER_TEMP/body.md" \
            --label agent

      # Two attempts, then a human owns it. Never auto-closed.
      - name: Escalate
        if: failure()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          N: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh issue view "$N" --json labels -q '.labels[].name' | grep -qx 'attempt:1'; then
            gh issue edit "$N" --add-label needs:human --remove-label active:agent
            gh issue comment "$N" --body "Second attempt failed; a human owns this now. $RUN"
          else
            gh issue edit "$N" --add-label attempt:1
            gh issue comment "$N" --body "Attempt failed, re-queueing. $RUN"
          fi
