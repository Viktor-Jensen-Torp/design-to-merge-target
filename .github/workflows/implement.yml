# The implementer. Label an issue, get a draft pull request.
#
# Goes in the TARGET repo at .github/workflows/implement.yml.
#
# Requires, in the target repo:
#   vars.IMPLEMENTER_APP_ID    the implementer GitHub App's numeric App ID
#   secrets.IMPLEMENTER_APP_PRIVATE_KEY   its private key, whole file
#   secrets.OPENROUTER_API_KEY
#   vars.IMPLEMENT_MODEL

name: Implement

on:
  issues:
    types: [labeled]

# A single shared group would DROP work: at most one run executes and one pends,
# and each new arrival cancels the pending one. Five labelled issues would give
# two runs and three silent cancellations. See NOTES.md section 5.
#
# One group per issue. Implementation is parallel by design (PRD, "Parallel
# implement, serial merge"); merging is serialised in review.yml instead.
concurrency:
  group: implement-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    if: github.event.label.name == 'ready-to-develop'
    runs-on: ubuntu-latest
    # An App installation token expires after one hour (NOTES.md section 9).
    # Do not raise this past ~55 without re-minting the token mid-job.
    timeout-minutes: 45

    steps:
      # A GITHUB_TOKEN-opened pull request produces CI runs in an
      # approval-required state, so review.yml would never fire — silently.
      # GITHUB_TOKEN-authored events also do not chain at all. NOTES.md 6.
      - name: Mint the implementer token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.IMPLEMENTER_APP_ID }}
          private-key: ${{ secrets.IMPLEMENTER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      # ADR 0002 — dependency changes are human work. Refuse before spending a
      # token rather than after reading a diff.
      # There is deliberately NO text check on the issue body for dependency work.
      #
      # There used to be: a grep for bump|upgrade|dependenc|lockfile|package.json.
      # On the first real issue it refused one whose body said "**No new
      # dependencies.**" — prose cannot distinguish an issue that NEEDS a
      # dependency from one that FORBIDS one, and the well-written issue is the
      # one that says the word (`NOTES.md` section 21).
      #
      # ADR 0002 is unchanged; only where it is enforced has moved. The
      # authoritative gate is the diff, in `review.yml`'s deterministic risk
      # check: any change touching package.json or pnpm-lock.yaml escalates to a
      # human without spending a model. That gate cannot be fooled by wording,
      # and it catches the case this one missed — an issue that needs a
      # dependency without ever using the word.

      # Zone 1 gates. An unconfigured hook is indistinguishable from a passing
      # one, so assert rather than assume — this was missed twice on Hermes.
      - name: Arm the local gates
        run: |
          git config core.hooksPath .githooks
          test "$(git config core.hooksPath)" = ".githooks"
          test -x .githooks/pre-commit
          test -x .githooks/pre-push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent

      # THE ONE STACK-SPECIFIC BLOCK. Change it with `ci.yml` when the project
      # is not pnpm.
      #
      # Without it the agent has no node_modules, so it cannot run a single
      # gate. On the first real run it discovered that, and then tried `npm
      # install`, `yarn install` and `corepack prepare` in turn — trying to
      # install its way out. `AGENTS.md`'s loudest rule is "do not change
      # dependencies", and the environment had made obeying it impossible
      # (`NOTES.md` section 23). An agent that cannot verify its own work will
      # do whatever it takes to be able to.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Assert the toolchain is actually there
        run: |
          test -d node_modules || { echo "::error::no node_modules after install"; exit 1; }
          pnpm exec tsc --version >/dev/null || { echo "::error::toolchain not runnable"; exit 1; }

      # The agent is GIVEN the issue. It is not asked to find it.
      #
      # `.agents/implementer.md` used to say "run gh issue view". On the first
      # real run the model read that file and did not do it, then spent 46 tool
      # calls guessing — git log --grep "4", then "issue", then "slug", then a
      # grep for TODO across node_modules. Nothing failed; it just never learned
      # what to build (`NOTES.md` section 23).
      #
      # A step the agent may skip is not a gate. `rework.yml` already gathers
      # its context this way; this is the same pattern, applied where it was
      # missing.
      - name: Gather the issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue view "$N" --repo "$REPO" --json title,body,comments --jq '
            "# " + .title + "\n\n" + (.body // "")
            + (if (.comments | length) > 0
               then "\n\n## Comments on the issue\n\n"
                    + ([.comments[] | "**" + .author.login + "** wrote:\n\n" + .body] | join("\n\n---\n\n"))
               else "" end)
          ' > "$RUNNER_TEMP/issue.md"
          test -s "$RUNNER_TEMP/issue.md" \
            || { echo "::error::issue #$N came back empty — refusing to run an agent with no brief"; exit 1; }
          echo "issue brief: $(wc -c < "$RUNNER_TEMP/issue.md") bytes"

      - name: Work the issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          git switch -c "agent/issue-$N"

          # Built in a file, so nothing in the issue body is re-parsed by the
          # shell on its way to the model.
          {
            printf 'Implement issue #%s in %s, following .agents/implementer.md.\n\n' "$N" "$REPO"
            printf 'The issue is reproduced below IN FULL. Do not go looking for it —\n'
            printf 'you already have it. Its acceptance criteria are what you are judged on.\n\n'
            printf -- '----- BEGIN ISSUE #%s -----\n' "$N"
            cat "$RUNNER_TEMP/issue.md"
            printf -- '\n----- END ISSUE #%s -----\n\n' "$N"
            printf 'Write your plan to %s/plan.md before you write any code.\n' "$RUNNER_TEMP"
            printf 'It becomes the pull request body.\n'
          } > "$RUNNER_TEMP/prompt.md"

          # Two channels, doing two jobs (NOTES.md section 2):
          #
          #   --approve      lets .pi/settings.json load at all. Without it,
          #                  project config is silently ignored in CI.
          #   --skill        loads regardless of trust, and carries the part
          #                  that must differ per role. The reviewer never sees
          #                  this file, and this role never sees the reviewer's.
          #                  On Hermes the reviewer read an instruction meant
          #                  for the implementer and refused to merge, twice.
          #
          # --mode json because the exit code is useless — see the next step.
          # The role's instructions are in the skill file, not here. Keeping
          # them in one place is the point: an instruction duplicated in two
          # places is an instruction that will disagree with itself.
          pi --mode json --approve \
             --skill .agents/implementer.md \
             --model "${{ vars.IMPLEMENT_MODEL }}" \
             "$(cat "$RUNNER_TEMP/prompt.md")" \
             | tee "$RUNNER_TEMP/pi.jsonl"

      # Cheap and local. review.yml escalates a dependency diff to a human, but
      # that costs a whole round trip to say something knowable here.
      - name: Assert the agent left the dependencies alone
        run: |
          if ! git diff --quiet HEAD -- package.json pnpm-lock.yaml; then
            echo "::error::the agent changed package.json or pnpm-lock.yaml (ADR 0002)"
            git --no-pager diff --stat HEAD -- package.json pnpm-lock.yaml
            exit 1
          fi

      # pi exits 0 when the task fails. Established by reading print-mode.ts and
      # main.ts, not documented anywhere, and not yet confirmed by a run —
      # NOTES.md section 1. So `if: failure()` cannot carry the escalation path.
      - name: Assert the agent did something
        run: |
          # Primary check, and the robust one: did work actually appear?
          if git diff --quiet origin/develop..HEAD; then
            echo "No commits on the branch — the agent produced nothing."
            exit 1
          fi

          # Secondary. The exact JSON field path is UNCONFIRMED; this is a
          # tolerant match on purpose, and it only ever adds a failure.
          # Tool-level isError is deliberately not checked — a failed tool call
          # mid-run is normal, and only the final stop reason is a verdict.
          if grep -qE '"stopReason"[[:space:]]*:[[:space:]]*"(error|aborted)"' "$RUNNER_TEMP/pi.jsonl"; then
            echo "Pi reported a terminal stopReason of error or aborted."
            exit 1
          fi

      - name: Publish the work
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          N: ${{ github.event.issue.number }}
        run: |
          BRANCH="agent/issue-$N"
          git push -u origin "$BRANCH"

          # A commit is not delivered until it is on the remote. The Hermes run
          # that cost the most was an implementer reporting work it had only
          # committed locally, which the reviewer then read and approved.
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "$BRANCH" | cut -f1)
          test "$LOCAL" = "$REMOTE" || {
            echo "Local HEAD $LOCAL does not match remote $REMOTE."
            exit 1
          }

          # ADR 0007 — the plan lives in the pull request body and nowhere
          # else. Not a committed file, so it cannot outlive the change and
          # become a document a later implementer believes.
          {
            echo "## Plan"
            echo
            if [ -s "$RUNNER_TEMP/plan.md" ]; then
              cat "$RUNNER_TEMP/plan.md"
            else
              echo "_The agent wrote no plan. Review the diff against the issue only,"
              echo "and treat the omission as a finding._"
            fi
            echo
            echo "---"
            echo
            echo "Closes #$N"
            echo
            echo "Head at open: $LOCAL"
          } > "$RUNNER_TEMP/body.md"

          gh pr create --draft --base develop \
            --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s)" \
            --body-file "$RUNNER_TEMP/body.md" \
            --label agent

      # Two attempts, then a human owns it. Never auto-closed.
      - name: Escalate
        if: failure()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          N: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh issue view "$N" --json labels -q '.labels[].name' | grep -qx 'attempt:1'; then
            gh issue edit "$N" --add-label needs:human --remove-label ready-to-develop
            gh issue comment "$N" --body "Second attempt failed; a human owns this now. $RUN"
          else
            gh issue edit "$N" --add-label attempt:1
            gh issue comment "$N" --body "Attempt failed, re-queueing. $RUN"
          fi
