# Opens the release pull request, `develop` → `main`.
#
# It exists because of a deadlock found on the first real release: a pull
# request's author can never approve it, `main` requires a CODEOWNERS approval,
# and on a small team the person opening the release is the only person who
# could approve it. The release then cannot merge at all.
#
# So a bot opens it. The human is the reviewer, which is what `0005` and `0011`
# actually describe — you *decide* the release, you do not author it.
#
# The body is the review aid, not a changelog. Per `0011` the release reviews
# the SEAMS: the files more than one issue touched, which is the one thing
# per-pull-request review is blind to by construction.
#
# TWO TRIGGERS, DOING DIFFERENT JOBS.
#
#   workflow_dispatch   opens the release, or refreshes an open one
#   push to develop     refreshes an open one, and NEVER opens one
#
# The push trigger exists because the body is written once and the pull request
# is not. A release pull request tracks `develop`, so anything merged after it
# opens ships inside it — while the "What is shipping" list, written at open
# time, does not mention it. On 2026-09-15 a release shipped a change to
# `review.yml` that its own manifest omitted, because the dispatch ran 38
# seconds before that pull request merged (`NOTES.md` 30). ADR 0011 makes that
# body the human's reading list, so a change missing from it is invisible in the
# one place the design says to look.
#
# It never CREATES on push: opening a release stays a deliberate act. Describing
# one accurately should not depend on timing.
name: release-pr

on:
  workflow_dispatch:
    inputs:
      head:
        description: "branch to release from"
        default: develop
      base:
        description: "branch to release into"
        default: main
  push:
    branches: [develop]

permissions:
  contents: read

# The one place in this design where cancelling is right. Every run recomputes
# the whole range from scratch, so a superseded run has nothing the newer one
# will not redo — unlike `implement.yml`, where a cancelled run is lost work
# (`NOTES.md` 5). Two merges landing seconds apart must not race on `gh pr edit`.
#
# The group is keyed by EVENT. A single shared group meant a dispatch cancelled
# the push run that a merge had just started, and GitHub renders a cancelled run
# as a RED CHECK on the release pull request — a check that is not a failure,
# on the one artefact a human is asked to read before approving. This file's
# sibling warns about exactly that: a workflow that is permanently red trains
# everyone to ignore it. Pushes still serialise against pushes, which is the
# race that mattered; a dispatch and a push may now overlap, and both write the
# identical body, so there is nothing to lose (`NOTES.md` 33).
concurrency:
  group: release-pr-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Describe the release, then open or update the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # `inputs` is empty on a push, so the defaults are restated here.
          HEAD: ${{ inputs.head || 'develop' }}
          BASE: ${{ inputs.base || 'main' }}
          MAY_CREATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          RANGE="origin/$BASE..origin/$HEAD"

          if [ -z "$(git log --format=%H "$RANGE")" ]; then
            echo "::notice::$HEAD is not ahead of $BASE — nothing to release"
            exit 0
          fi

          # `closingIssuesReferences` is empty for a pull request that did not
          # target the default branch, so the body is parsed (`NOTES.md` 19).
          parse_closes() {
            awk '/^[[:space:]]*```/{f=!f; next} !f' \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -un || true
          }
          # The `|| true` is load-bearing. grep exits 1 when it matches nothing,
          # `set -o pipefail` promotes that to the pipeline, and `set -e` then
          # kills the job — with NO output at all, because grep says nothing
          # when it finds nothing. A pull request with no `Closes #n` is
          # ordinary, not an error (`NOTES.md` section 24).

          # commit -> pull request, from the squash subjects. This is why the
          # queue squashes into develop and releases are merge commits (`0011`).
          PAIRS=$(mktemp)
          git log --format=$'%H\t%s' "$RANGE" | while IFS=$'\t' read -r sha subj; do
            n=$(sed -n 's/.*(#\([0-9][0-9]*\))[[:space:]]*$/\1/p' <<< "$subj")
            [ -z "$n" ] && continue
            git show --name-only --format= "$sha" | sed '/^$/d' | sed "s|^|$n |"
          done > "$PAIRS"

          PRS=$(awk '{print $1}' "$PAIRS" | sort -un)
          if [ -z "$PRS" ]; then
            echo "::notice::no (#n) subjects in $RANGE — nothing this workflow can describe"
            exit 0
          fi

          # The seams: every file more than one pull request touched.
          SEAMS=$(awk '{print $2"\t"$1}' "$PAIRS" | sort -u \
                   | awk -F'\t' '{c[$1]++} END{for (f in c) if (c[f] > 1) print c[f]"\t"f}' \
                   | sort -k1,1nr -k2,2)

          # The same overlap, read the other way round: which pull requests
          # cannot be dropped alone. `0011` says a rejected issue is REVERTED,
          # and a revert of one that another was built on leaves the second
          # calling into code that is no longer there. The seam table shows
          # where to look; this shows what a decision costs.
          #
          # DROP_GROUPS, not GROUPS. **`GROUPS` is a bash special variable** —
          # an array of the caller's group ids — and bash REFUSES the
          # assignment. Under `set -e` that killed this step instantly with no
          # output whatsoever, which is how it shipped: it looked like a step
          # that had not run rather than one that had failed (`NOTES.md` 36).
          #
          # In a file rather than a heredoc, so it can be tested. The version
          # that shipped had a `python3 - <<PY` inside `$( )`, which is
          # untestable in place and was the first thing suspected here — wrongly,
          # and at some cost.
          test -x scripts/release-groups.py \
            || { echo "::error::scripts/release-groups.py is missing"; exit 1; }
          DROP_GROUPS=$(python3 scripts/release-groups.py "$PAIRS")

          BODY=$(mktemp)
          {
            printf 'Releasing `%s` into `%s`.\n\n' "$HEAD" "$BASE"
            printf '## What is shipping\n\n'
            for p in $PRS; do
              title=$(gh pr view "$p" --json title -q .title 2>/dev/null || echo "(unknown)")
              issues=$(gh pr view "$p" --json body -q .body 2>/dev/null | parse_closes | sed 's/^/#/' | tr '\n' ' ')
              printf -- '- #%s %s%s\n' "$p" "$title" "${issues:+  — closes ${issues% }}"
            done

            printf '\n## Read these first: the seams\n\n'
            if [ -n "$SEAMS" ]; then
              printf 'Files more than one pull request touched. Per-pull-request review\n'
              printf 'cannot see two changes that are each right and wrong together, so\n'
              printf 'this is the part the release actually reviews (ADR 0011).\n\n'
              printf '| pull requests | file |\n|---|---|\n'
              printf '%s\n' "$SEAMS" | while IFS=$'\t' read -r c f; do
                printf '| %s | `%s` |\n' "$c" "$f"
              done
            else
              printf 'None — no file was touched by more than one pull request in this\n'
              printf 'release. There is no seam to read.\n'
            fi

            printf '\n## If you drop one, you drop the group\n\n'
            if [ -n "$DROP_GROUPS" ]; then
              printf 'These pull requests touch the same files. Reverting one on its own\n'
              printf 'leaves the others building on code that is no longer there, so each\n'
              printf 'group goes or stays together.\n\n'
              # One sed, not `printf '#%s '`: printf's format cycling is not
              # worth relying on across shells, and this is unambiguous.
              printf '%s\n' "$DROP_GROUPS" | while read -r g; do
                printf -- '- %s\n' "$(printf '%s' "$g" | sed 's/ /, #/g; s/^/#/')"
              done
              printf '\n**This is computed from file overlap, which is a proxy.** Two pull\n'
              printf 'requests can depend on each other without sharing a file — one calls\n'
              printf 'a function the other added. Treat this list as the cases worth\n'
              printf 'checking first, not as the complete set.\n'
            else
              printf 'No two pull requests in this release touched the same file, so any of\n'
              printf 'them can be reverted on its own — as far as file overlap can tell. A\n'
              printf 'dependency that does not show up as a shared file will not show up\n'
              printf 'here either.\n'
            fi

            printf '\n## Before approving\n\n'
            printf -- '- [ ] Every pull request above was reviewed by the developer who owns its epic.\n'
            printf -- '- [ ] The seams above read correctly as a whole, not just individually.\n'
            printf -- '- [ ] Anything you disagree with is reverted, not held — `git revert <sha>`\n'
            printf '      on `%s`. The release ships without it (ADR 0011).\n' "$HEAD"
            printf '\n---\n\n'
            printf 'Opened by the releaser app. A pull request author cannot approve their own\n'
            printf 'pull request, so a human opening this could never merge it.\n'
          } > "$BODY"

          EXISTING=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh pr edit "$EXISTING" --body-file "$BODY"
            echo "::notice::updated existing release pull request #$EXISTING"
            gh pr view "$EXISTING" --json url -q .url
          elif [ "$MAY_CREATE" = "true" ]; then
            gh pr create --base "$BASE" --head "$HEAD" \
              --title "Release: $HEAD → $BASE" --body-file "$BODY"
          else
            echo "::notice::no open release pull request to refresh, and a push never opens one"
          fi
