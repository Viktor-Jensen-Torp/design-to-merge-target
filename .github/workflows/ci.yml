# CI. Goes in the TARGET repo at .github/workflows/ci.yml.
#
# Two strings in this file are load-bearing and both fail silently:
#
#   name: CI          `review.yml` triggers on `workflow_run` matching this
#                     LITERALLY. Rename it and the reviewer simply never fires.
#
#   merge_group       Every check required by the `develop` ruleset must also
#                     run on this event. A required check that never reports for
#                     a merge group leaves the queue entry to die at the
#                     status-check timeout, with nothing saying why (NOTES.md 12).
#
# Mark as required on `develop`: quality, test.
# Add e2e and mutation to the required set once they are stable — and only if
# they run on merge_group too, which they do here.

name: CI

on:
  pull_request:
  merge_group:
  push:
    # CI on develop is the guard that stops a broken branch point poisoning
    # every implementer that cuts from it (PRD, "The merge queue closes the
    # last gap").
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # ADR 0004 names this failure in its own consequences and then did not
      # guard it: `review.yml` triggers on `workflow_run` matching this
      # workflow's `name:` LITERALLY. Rename one without the other and every
      # review in the pipeline stops firing — with nothing red, nothing
      # logged, and no pull request left unmerged to notice. `CLAUDE.md`: assert
      # every gate, never assume one.
      #
      # It runs in `quality` rather than as its own job because `quality` is
      # already required on `develop` and already runs on `merge_group`. A new
      # job would have to be added to both or it would be a gate that does not
      # gate.
      - name: The reviewer's trigger still names this workflow
        run: |
          set -euo pipefail
          HERE=$(sed -n 's/^name:[[:space:]]*//p' .github/workflows/ci.yml | head -1)
          WANT=$(grep -oE 'workflows:[[:space:]]*\["[^"]+"\]' .github/workflows/review.yml \
                 | head -1 | sed -E 's/.*\["([^"]+)"\].*/\1/')

          # Either side coming back empty means the parse broke, not that the
          # names agree. An assertion that cannot fail is worse than none.
          test -n "$HERE" || { echo "::error::could not read name: from ci.yml"; exit 1; }
          test -n "$WANT" || { echo "::error::could not read the workflow_run trigger from review.yml"; exit 1; }

          if [ "$HERE" != "$WANT" ]; then
            echo "::error::review.yml waits for a workflow called '$WANT', this one is called '$HERE'."
            echo "::error::The reviewer would never fire, and would never say so (ADR 0004)."
            exit 1
          fi
          echo "reviewer trigger matches: '$HERE'"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run


# `e2e` and `mutation` are deliberately ABSENT, not stubbed.
#
# The tooling for them — Playwright, Stryker — is not installed yet. A job that
# echoes and exits 0 would be a green gate that checks nothing, which is the
# exact failure this pipeline keeps hitting. An absent gate is visible; a
# vacuous one is not. Both jobs are in the design repo's `workflows/ci.yml`,
# ready to paste back when the tooling lands.
