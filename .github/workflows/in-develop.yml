# Applies `in:develop` to every issue a merged pull request closes — and undoes
# that when a pull request REVERTS one.
#
# ADR 0011: `Done` means merged to `main`. The middle state — merged to
# `develop`, awaiting release — has to be readable by a human, by a Project view
# and by any harness, so it is a label on the issue (`0001`, `0003`).
#
# Why not the gatekeeper, which already acts at merge time: it only *enqueues*.
# The merge lands minutes later, inside the queue, in a run the gatekeeper is
# not part of. It never sees the merge happen.
#
# Why the body is parsed by hand: GitHub only auto-closes linked issues when
# the pull request merges into the DEFAULT branch (`NOTES.md` section 18) — and
# it does not even record the link, so `closingIssuesReferences` is empty for a
# pull request into `develop` (`NOTES.md` section 19). Nothing native survives
# here; the parse is the only source.
#
# The revert half exists because ADR 0011 promises it and nothing implemented
# it. `0011` says a rejected issue is reverted rather than held, and that "the
# issue reopens, with the objection as a comment". Until 2026-09-16 no workflow
# watched for a revert, so the code went away and the issue kept `in:develop`
# and stayed closed-looking forever: work silently lost, which is this project's
# signature failure (`NOTES.md` 34).
name: in-develop

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# This job never checks out. Without GH_REPO every `gh` call dies with
# "not a git repository" (`NOTES.md` section 17b).
env:
  GH_REPO: ${{ github.repository }}

jobs:
  label:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Label every issue this pull request closes
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # GitHub does NOT create a closing-issue link for a pull request whose
          # base is not the DEFAULT branch, so `closingIssuesReferences` comes
          # back empty here even when the body says `Closes #n`
          # (`NOTES.md` section 19 — established by running it, not by reading).
          # So parse the body, skipping fenced code blocks, and accept every
          # keyword GitHub itself accepts.
          parse_closes() {
            awk '/^[[:space:]]*```/{f=!f; next} !f' \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -un || true
          }
          # The `|| true` is load-bearing. grep exits 1 when it matches nothing,
          # `set -o pipefail` promotes that to the pipeline, and `set -e` then
          # kills the job — with NO output at all, because grep says nothing
          # when it finds nothing. A pull request with no `Closes #n` is
          # ordinary, not an error (`NOTES.md` section 24).

          ISSUES=$(gh pr view "$PR" --json body -q .body | parse_closes)

          # An agent branch carries the issue number too. Belt and braces: a
          # body that lost its `Closes #n` still lands, and a human's branch
          # that has no such name still works through the body (`0008`).
          case "$HEAD" in
            agent/issue-*) ISSUES=$(printf '%s\n%s\n' "$ISSUES" "${HEAD##*issue-}" \
                                      | grep -E '^[0-9]+$' | sort -un || true) ;;
          esac

          if [ -z "$ISSUES" ]; then
            echo "::warning::pull request #$PR closes no issue — nothing to label"
            exit 0
          fi

          for N in $ISSUES; do
            gh issue edit "$N" --add-label "in:develop"
            echo "issue #$N -> in:develop"
          done

          # Assert it. A label that did not apply looks exactly like one that
          # did, and the release reads this label to build its list.
          for N in $ISSUES; do
            gh issue view "$N" --json labels -q '[.labels[].name]|join(",")' \
              | grep -q 'in:develop' \
              || { echo "::error::issue #$N did not take the in:develop label"; exit 1; }
          done

  # ── A revert puts the issue back in play.
  #
  # After `label`, not beside it. Both edit labels on the same issue, and a
  # revert pull request that happens to carry a `Closes #n` would otherwise have
  # one job adding `in:develop` while the other removes it, with the winner
  # decided by scheduling.
  unrevert:
    needs: label
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Reopen every issue this pull request reverted
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          J=$(gh pr view "$PR" --json body,commits)

          # Two ways in, because one of them does not depend on anyone
          # remembering anything.
          #
          # 1. `git revert` writes "This reverts commit <sha>." into the commit
          #    body itself. Machine-written, so it is there whatever the author
          #    called the pull request. Each sha maps back to its pull request
          #    through the commits API.
          # 2. `Reverts #n` in the body, for a hand-written undo that is not a
          #    literal `git revert` — a follow-up that removes the feature by
          #    other means still needs the issue reopened.
          SHAS=$(jq -r '[.commits[].messageBody // ""] | join("\n")' <<< "$J" \
                 | grep -oE 'This reverts commit [0-9a-f]{7,40}' \
                 | grep -oE '[0-9a-f]{7,40}' | sort -u || true)
          # The `|| true` is load-bearing — grep exits 1 when it matches
          # nothing, and most pull requests revert nothing (`NOTES.md` 24).

          REVERTED=""
          for SHA in $SHAS; do
            N=$(gh api "repos/{owner}/{repo}/commits/$SHA/pulls" \
                  --jq '.[].number' 2>/dev/null | head -1 || true)
            if [ -n "$N" ]; then REVERTED="$REVERTED $N"; fi
          done

          FROM_BODY=$(jq -r '.body // ""' <<< "$J" \
                      | awk '/^[[:space:]]*```/{f=!f; next} !f' \
                      | grep -oiE 'revert(s|ed)?[[:space:]]+#[0-9]+' \
                      | grep -oE '[0-9]+' | sort -un || true)
          REVERTED=$(printf '%s %s' "$REVERTED" "$FROM_BODY" \
                     | tr ' ' '\n' | grep -E '^[0-9]+$' | sort -un || true)

          if [ -z "$REVERTED" ]; then
            echo "pull request #$PR reverts nothing"
            exit 0
          fi
          echo "reverts: $(echo $REVERTED | tr '\n' ' ')"

          parse_closes() {
            awk '/^[[:space:]]*```/{f=!f; next} !f' \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -un || true
          }

          # A reverted pull request's issues, by the same two routes the label
          # job uses: the body, and the agent branch name.
          ISSUES=""
          for P in $REVERTED; do
            FOUND=$(gh pr view "$P" --json body -q .body 2>/dev/null | parse_closes || true)
            HEAD=$(gh pr view "$P" --json headRefName -q .headRefName 2>/dev/null || true)
            case "$HEAD" in agent/issue-*) FOUND="$FOUND ${HEAD##*issue-}" ;; esac
            ISSUES="$ISSUES $FOUND"
          done
          ISSUES=$(printf '%s' "$ISSUES" | tr ' ' '\n' | grep -E '^[0-9]+$' | sort -un || true)

          if [ -z "$ISSUES" ]; then
            echo "::warning::#$PR reverts pull requests that close no issue — nothing to reopen"
            exit 0
          fi

          for N in $ISSUES; do
            gh issue reopen "$N" 2>/dev/null || true

            # `needs:human`, NOT `active:agent`. ADR 0011 says the issue
            # reopens; it does not say it goes straight back to an agent, and
            # sending it back unchanged would produce the same work that was
            # just rejected. A revert is a human's decision, so the next move is
            # a human's too — they re-label when the issue has been re-scoped.
            STALE=$(gh issue view "$N" --json labels \
                      -q '[.labels[].name
                           | select(. == "in:develop" or . == "active:agent")]
                          | join(",")')
            if [ -n "$STALE" ]; then
              gh issue edit "$N" --remove-label "$STALE"
            fi
            gh issue edit "$N" --add-label needs:human
            gh issue comment "$N" --body \
              "Reverted on \`develop\` by $RUN. The work is no longer in the branch and this issue is open again. Re-scope it and re-label \`active:agent\` when it is ready to be attempted; the objection should be on the reverting pull request."
            echo "issue #$N -> reopened, needs:human"
          done

          # Assert it. A reopen that silently failed leaves work that shipped,
          # was pulled, and is now tracked nowhere.
          for N in $ISSUES; do
            [ "$(gh issue view "$N" --json state -q .state)" = "OPEN" ] \
              || { echo "::error::issue #$N is still closed after its work was reverted"; exit 1; }
          done
