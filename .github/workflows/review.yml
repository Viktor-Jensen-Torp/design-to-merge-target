# The review and gatekeep jobs.
#
# ADR 0004 shapes the trigger entirely: CI green is a precondition for review,
# not a finding of it. workflow_run gives that for free — this cannot start
# before CI finishes, and the conclusion is in the event.
#
# ADR 0006 shapes the jobs: the reviewer returns a verdict and holds no
# authority; a separate gatekeeper merges or escalates. ADR 0012 says what a
# verdict is MADE OF: a GitHub review, whose `state` is the decision and whose
# `commit_id` is the commit judged. Nothing here parses a verdict out of prose. Two jobs rather than two
# workflows, deliberately — each still gets its own App, model and skill file,
# but there is no second trigger to misfire and no extra link in a workflow_run
# chain (which caps at three levels, NOTES.md section 7).
#
# Goes in the TARGET repo at .github/workflows/review.yml.
#
# Requires, in the target repo:
#   vars.REVIEWER_APP_ID    secrets.REVIEWER_APP_PRIVATE_KEY
#   vars.GATEKEEPER_APP_ID  secrets.GATEKEEPER_APP_PRIVATE_KEY
#   secrets.OPENROUTER_API_KEY
#   vars.REVIEW_MODEL              vars.GATEKEEP_MODEL

name: Review

on:
  workflow_run:
    workflows: ["CI"]            # must match the `name:` of the test workflow
    types: [completed]

permissions:
  contents: read

jobs:
  # ── Find the pull request, and turn a red build back without spending a token
  triage:
    # CI also runs on `push` to develop, where there is no pull request to find.
    # Without this the job goes red on every merge (NOTES.md section 18).
    if: github.event.workflow_run.event != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.pr.outputs.number }}
      green: ${{ steps.pr.outputs.green }}
      blocked: ${{ steps.conflict.outputs.blocked }}
      risky: ${{ steps.risk.outputs.risky }}
      reasons: ${{ steps.risk.outputs.reasons }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      # A CANCELLED CI run is not a red build. `ci.yml` cancels the run in
      # flight when a new commit is pushed, so a perfectly good pull request
      # whose author pushes twice in quick succession produces a cancelled run —
      # and this workflow used to read "not success" as red, comment "CI is red",
      # label `needs:rework` and spend a STRIKE on work that was never wrong
      # (`NOTES.md` 37, found by the guard 2 spike).
      #
      # A cancellation means a newer run is already coming. The right move is to
      # do nothing and let that run's chain decide — the same reasoning as guard
      # 2 declining a stale verdict. `skipped` is the same case.
      #
      # This is the second time a cancelled run has been mistaken for a failed
      # one (`NOTES.md` 33 was the first, on a release pull request's checks).
      # The general form is worth keeping: **cancelled is not failed, and
      # nothing in this pipeline should treat it as a verdict.**
      - name: A cancelled run is not a red build
        id: cancelled
        run: |
          C='${{ github.event.workflow_run.conclusion }}'
          case "$C" in
            cancelled|skipped)
              echo "CI run was $C — a newer run is coming, nothing to decide here."
              echo "stop=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "stop=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # A merge-group CI run that FAILED means the queue ejected this pull
      # request: it passed alone but not against the entries ahead of it. That
      # is the semantic conflict ADR 0010 adopted the queue to catch, and it is
      # the fourth door into the rework loop (ADR 0009).
      #
      # The head SHA of a merge group belongs to a temporary branch, so the
      # normal lookup below finds nothing. The pull request number has to come
      # out of the branch name instead.
      #
      # UNVERIFIED: GitHub documents the prefix `gh-readonly-queue/{base}` but
      # not the rest of the format. The `pr-<n>` segment is assumed. Confirm it
      # on the first queued run and record it in NOTES.md — if it is wrong, this
      # step silently does nothing, which is the failure shape this repo exists
      # to avoid.
      - name: Ejected from the merge queue
        id: ejected
        # Same reasoning as the step above, and the same bug it fixes: a
        # merge-group run that is CANCELLED — the queue reordered, or the entry
        # was removed — is not an ejection, and telling the implementer its
        # change failed alongside the entries ahead of it would be false.
        if: steps.cancelled.outputs.stop != 'true'
          && startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/')
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "The queue is green; it will merge on its own."
            exit 0
          fi
          NUM=$(sed -n 's/.*pr-\([0-9][0-9]*\).*/\1/p' <<< "$BRANCH")
          if [ -z "$NUM" ]; then
            echo "::warning::Could not read a pull request number out of '$BRANCH'."
            echo "The merge-group branch format is not what this workflow assumes."
            exit 0
          fi
          gh pr comment "$NUM" --repo "$REPO" --body "Ejected from the merge queue: this change passes on its own but not alongside the entries ahead of it. Back to the implementer (ADR 0010). $RUN"
          gh pr edit "$NUM" --repo "$REPO" --add-label needs:rework

      # workflow_run's `pull_requests` payload is documented as NOT necessarily
      # indicating the PR that triggered the run, so it is not used here.
      - name: Find the pull request
        id: pr
        if: steps.cancelled.outputs.stop != 'true'
          && !startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/')
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          NUM=$(gh pr list --repo "$REPO" --search "$SHA" --state open \
                  --json number,labels \
                  --jq '.[] | select(.labels[].name == "agent") | .number' | head -1)
          if [ -z "$NUM" ]; then
            echo "No agent pull request for $SHA — nothing to do."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      # ADR 0009 — we never detect conflicts ourselves except here, cheaply,
      # to avoid paying for a review of a diff that is about to change anyway.
      # The authoritative refusal still comes from GitHub at the merge attempt.
      - name: A conflicted pull request is reworked, not reviewed
        id: conflict
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          M=$(gh pr view "$PR" --repo "$REPO" --json mergeable -q '.mergeable')
          if [ "$M" = "CONFLICTING" ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body "Conflicts with develop. Back to the implementer before review (ADR 0009)."
            gh pr edit "$PR" --repo "$REPO" --add-label needs:rework
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Red build goes back
        if: steps.pr.outputs.number != '' && steps.pr.outputs.green != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" \
            --body "CI is red. Back to the implementer without review (ADR 0004)."
          gh pr edit "$PR" --repo "$REPO" --add-label needs:rework

      # ADR 0006: most of the escalation list is authority, not correctness, and
      # authority is a grep over changed paths. Run it deterministically so the
      # cheap, reliable escalations never depend on a model noticing.
      - name: Deterministic risk check
        id: risk
        if: steps.pr.outputs.number != '' && steps.pr.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          FILES=$(gh pr diff "$PR" --repo "$REPO" --name-only)
          REASONS=""
          grep -qE '^\.github/'                      <<< "$FILES" && REASONS="$REASONS- touches .github/ (root of trust)\n"
          grep -qE '(^|/)CODEOWNERS$'                <<< "$FILES" && REASONS="$REASONS- touches CODEOWNERS\n"
          grep -qE '(^|/)AGENTS\.md$'                <<< "$FILES" && REASONS="$REASONS- touches AGENTS.md\n"
          grep -qE '(^|/)\.agents/'                  <<< "$FILES" && REASONS="$REASONS- touches agent role instructions\n"
          grep -qE '(^|/)\.githooks/'                <<< "$FILES" && REASONS="$REASONS- touches the local gates\n"
          grep -qE '(^|/)(package\.json|pnpm-lock\.yaml)$' <<< "$FILES" && REASONS="$REASONS- changes dependencies (ADR 0002)\n"
          if [ -n "$REASONS" ]; then
            echo "risky=true" >> "$GITHUB_OUTPUT"
            { echo "reasons<<EOF"; printf "%b" "$REASONS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "risky=false" >> "$GITHUB_OUTPUT"
          fi

  # ── The verdict. No authority: this token cannot merge, and this job's only
  #    side effect is a comment.
  review:
    needs: triage
    if: needs.triage.outputs.number != '' && needs.triage.outputs.green == 'true'
        && needs.triage.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      # Role instructions, shared Pi config and AGENTS.md — never the source code.
      #
      # `AGENTS.md` is checked out because `reviewer.md` step 5 tells this role
      # to read it: "the repository's own conventions and its accumulated
      # corrections. A finding recorded there has already been made once." It was
      # not in this list, so the reviewer was told to read a file it did not
      # have, found nothing, and said nothing about finding nothing
      # (`NOTES.md` 41). The gatekeeper has the same instruction and had the same
      # hole.
      #
      # It is not source. `0004` forbids this role reading a local worktree of
      # the change under review; AGENTS.md is a repository convention document
      # and comes from the DEFAULT BRANCH like the role files, so a pull request
      # cannot rewrite the standards it is judged against.
      # ADR 0004 forbids this role reading a local worktree, and a sparse
      # checkout of these two paths keeps that intact while making --skill
      # resolvable. It also comes from the DEFAULT BRANCH in a workflow_run job,
      # which is the property we want: a pull request cannot rewrite the
      # instructions of the role that judges it.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .agents
            .pi
            AGENTS.md
            scripts/pi-driver.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent

      # WHEN IS A REVIEW FINISHED?
      #
      # Not "a review exists" — on a rework round one already does, left by the
      # previous round, so that check is green before this run starts and gates
      # nothing (`NOTES.md` 27 is the same trap on the implementer). The review
      # has to be about the commit under review.
      #
      # Since `0012` that is an equality test on `commit_id`, which GitHub
      # records on the review itself. The reviewer no longer has to state the
      # SHA, and this no longer depends on it having remembered to.
      - name: Define what a finished review means
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/review-done.sh" <<'DONE'
          set -u
          HEAD=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          # `0012`: the verdict IS the review. Its `commit_id` is the commit it
          # was submitted against — recorded by GitHub, not written by a model,
          # so this is an equality test rather than a prefix match over prose.
          R=$(gh api "repos/$REPO/pulls/$PR/reviews" \
                --jq '[.[] | select(.state != "PENDING")] | last // empty')

          if [ -z "$R" ]; then
            echo "Pull request #$PR carries no review."
            echo "The commit under review is $HEAD."
            exit 1
          fi
          AT=$(jq -r '.commit_id' <<< "$R")
          STATE=$(jq -r '.state' <<< "$R")
          if [ "$AT" != "$HEAD" ]; then
            echo "The latest review on #$PR is not about the commit under review."
            echo "  commit under review: $HEAD"
            echo "  latest review:       $STATE, submitted against $AT"
            exit 1
          fi
          echo "A $STATE review against $HEAD is posted."
          DONE
          chmod +x "$RUNNER_TEMP/review-done.sh"

      - name: Review the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          # Read by .pi/extensions/submit.ts: which submit tool to register,
          # and which pull request it posts the verdict to. The tool reads the
          # head SHA itself, so the role never states it (`0009` guard 2).
          PI_ROLE: reviewer
          PI_PR: ${{ needs.triage.outputs.number }}
          PI_REPO: ${{ github.repository }}
          PI_OFFLINE: "1"
        run: |
          # No checkout above, for two independent reasons.
          #
          # ADR 0004: on the Hermes run the reviewer read its own worktree and
          # approved code that was not on the remote — the board, the worktree
          # and the agent's own account all agreed while being wrong.
          #
          # And mechanically: in a workflow_run job, GITHUB_SHA and GITHUB_REF
          # point at the DEFAULT BRANCH, not the triggering run, so a bare
          # actions/checkout would fetch the wrong code (NOTES.md section 7).
          #
          # --tools is an allowlist, not the --exclude-tools denylist this used
          # to be. The difference is what happens when Pi gains a tool: a
          # denylist silently grants it, an allowlist silently withholds it, and
          # of the two only the second fails safe.
          #
          # Note plainly what it is worth: the role still holds `bash`, which
          # writes files, and needs it to run `gh` at all. This is hygiene, not
          # a control. The control is that this App has no merge rights.
          # Refuse to run an agent with no role instructions. `--skill` used to
          # fail silently here and two runs went out with none (`NOTES.md` 25).
          test -s .agents/reviewer.md \
            || { echo "::error::.agents/reviewer.md is missing or empty"; exit 1; }
          test -s .agents/nudge-reviewer.md \
            || { echo "::error::.agents/nudge-reviewer.md is missing or empty"; exit 1; }
          test -x scripts/pi-driver.py \
            || { echo "::error::scripts/pi-driver.py missing from the sparse checkout"; exit 1; }
          # `.pi/extensions/` is auto-discovered, so a missing file is silent:
          # the run would proceed with no submit_review tool at all and the role
          # would have no way to post anything.
          test -s .pi/extensions/submit.ts \
            || { echo "::error::.pi/extensions/submit.ts missing — the role has no way to post a verdict"; exit 1; }
          test -s AGENTS.md \
            || { echo "::error::AGENTS.md is not in the checkout — this role is told to read it"; exit 1; }
          echo "role instructions: $(wc -c < .agents/reviewer.md) bytes"

          cat > "$RUNNER_TEMP/prompt.md" <<PROMPT
          Review pull request #$PR in $REPO, following .agents/reviewer.md.

          That file holds the passes to run, what counts as Important rather
          than a nit, the nit cap, what not to report, and the exact shape of
          the verdict. Follow it rather than improvising a format.
          PROMPT

          # The driver, for the same reason the other two roles have one: `pi`
          # exits 0 when the task fails (`NOTES.md` 1), so a provider 429 or a
          # model that thinks and says nothing used to leave this step green and
          # the pull request silently unreviewed. The gatekeeper would then read
          # an absent verdict as `unsure` and escalate — the right outcome by
          # accident, arrived at without anyone knowing the review never ran.
          python3 scripts/pi-driver.py \
            --prompt-file "$RUNNER_TEMP/prompt.md" \
            --nudge-file .agents/nudge-reviewer.md \
            --done "bash $RUNNER_TEMP/review-done.sh" \
            --max-nudges 2 \
            --idle-timeout 600 \
            --timeout 1500 \
            --log "$RUNNER_TEMP/rpc.jsonl" \
            -- pi --mode rpc --approve \
                  --append-system-prompt "$(cat .agents/reviewer.md)" \
                  --model "${{ vars.REVIEW_MODEL }}" \
                  --tools read,grep,find,ls,bash,submit_review

  # ── The authority. Serial, so two merges never race.
  gatekeep:
    needs: [triage, review]
    # `!cancelled()`, because the reviewer's step can now FAIL rather than
    # quietly producing nothing. Without it a failed review skips this job and
    # the pull request is orphaned: no verdict, no label, nobody listening —
    # the silent outcome ADR 0006 exists to forbid, reintroduced by the very
    # change that made failures visible.
    #
    # With it, "Route on the verdict" finds no verdict, reads that as `unsure`,
    # and labels `needs:human`. A review that could not run is a human's
    # problem, and now says so.
    if: ${{ !cancelled()
        && needs.triage.outputs.number != '' && needs.triage.outputs.green == 'true'
        && needs.triage.outputs.blocked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `concurrency: merge` here. ADR 0010 — `develop` requires a merge queue,
    # so GitHub serialises. `gh pr merge` enqueues rather than merging, and the
    # queue builds each entry against the base plus everything ahead of it.
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.GATEKEEPER_APP_ID }}
          private-key: ${{ secrets.GATEKEEPER_APP_PRIVATE_KEY }}

      # ADR 0006 allows no third ending. This says what the endings ARE, once,
      # and two things read it: the driver that will not let the agent stop
      # without one, and the safety net that fires if it stopped anyway.
      # Written here rather than in either consumer because a condition stated
      # in two places is a condition that will eventually disagree with itself.
      #
      # QUEUED is the case this file used to miss. Under a merge queue
      # `gh pr merge` does not merge — it enqueues, and the merge lands minutes
      # later. On 2026-09-15 the gatekeeper enqueued #16 correctly, its next
      # turn died on a provider 429, and this check called it a silent stop and
      # labelled `needs:human` 32 seconds before the queue merged it
      # (`NOTES.md` 29). A gatekeeper that has succeeded must not look like one
      # that did nothing.
      - name: Define what ending the run means
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/gatekeeper-done.sh" <<'DONE'
          set -u
          OWNER=${REPO%%/*}; NAME=${REPO##*/}
          J=$(gh pr view "$PR" --repo "$REPO" --json state,labels,autoMergeRequest)
          STATE=$(jq -r '.state' <<< "$J")
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<< "$J")
          AUTO=$(jq -r 'if .autoMergeRequest then "yes" else "no" end' <<< "$J")
          # `isInMergeQueue` is GraphQL-only; `gh pr view` does not expose it.
          Q='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){isInMergeQueue}}}'
          QUEUE=$(gh api graphql -f query="$Q" -F o="$OWNER" -F n="$NAME" -F p="$PR" \
                    --jq '.data.repository.pullRequest.isInMergeQueue' 2>/dev/null || echo unknown)

          case "$STATE" in MERGED|CLOSED) echo "Pull request #$PR is $STATE."; exit 0 ;; esac
          [ "$QUEUE" = "true" ] && { echo "Pull request #$PR is in the merge queue."; exit 0; }
          [ "$AUTO"  = "yes"  ] && { echo "Pull request #$PR is queued to merge (auto-merge enabled)."; exit 0; }
          case ",$LABELS," in
            *,needs:human,*|*,needs:rework,*) echo "Pull request #$PR is labelled: $LABELS"; exit 0 ;;
          esac
          # A `stale:` label is also an ending, and a deliberate one: guard 2
          # declined to merge a verdict for a commit that is no longer the head,
          # said so on the pull request, and left the review of the NEW head to
          # decide. Without this the safety net would call that silence and
          # escalate a pull request that is working exactly as designed.
          case "$LABELS" in
            *stale:*) echo "Pull request #$PR is waiting on a fresh verdict: $LABELS"; exit 0 ;;
          esac

          echo "Pull request #$PR has no outcome."
          echo "  state:        $STATE"
          echo "  labels:       ${LABELS:-none}"
          echo "  in queue:     $QUEUE"
          echo "  auto-merge:   $AUTO"
          echo "It is still open, it is not queued to merge, and it carries neither"
          echo "needs:human nor needs:rework."
          exit 1
          DONE
          chmod +x "$RUNNER_TEMP/gatekeeper-done.sh"

      # ADR 0009 — read the verdict and route on it deterministically. A model
      # is only worth spending when the reviewer actually wants this merged.
      # This also resets the strike count, which is what makes strikes
      # CONSECUTIVE rather than lifetime.
      - name: Route on the verdict
        id: verdict
        if: needs.triage.outputs.risky != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          # One read, reused below. Every `gh pr view` is a round trip.
          PRJSON=$(gh pr view "$PR" --repo "$REPO" --json labels,headRefOid)
          HEAD=$(jq -r '.headRefOid' <<< "$PRJSON")

          # `0012`: the verdict is a REVIEW. Two fields, both recorded by
          # GitHub — `state` is the decision and `commit_id` is what was judged.
          # Nothing here parses prose a model wrote.
          #
          # `0013`: the last review **by the reviewer App**, not by anyone. A
          # person leaving a COMMENTED review must not silently become the
          # verdict, and a person approving must not become one either —
          # approving is not how a human authorises a merge here (`0005`).
          REVIEWS=$(gh api "repos/$REPO/pulls/$PR/reviews")
          R=$(jq -c '[.[] | select(.state != "PENDING")
                          | select(.user.login | endswith("[bot]"))] | last // empty' <<< "$REVIEWS")
          # `${R:-null}`, not `${R:-{}}` — the closing brace inside the default
          # terminates the expansion early and jq gets malformed input. `null`
          # is valid JSON and `.state // ""` on it gives the empty string.
          RJ=${R:-null}
          AT=$(jq -r '.commit_id // ""' <<< "$RJ")
          case "$(jq -r '.state // ""' <<< "$RJ")" in
            APPROVED)          V=merge ;;
            CHANGES_REQUESTED) V=rework ;;
            COMMENTED)         V=unsure ;;
            *)                 V="" ;;
          esac

          # ── ADR 0013. A human who has written on this pull request since the
          # verdict stops the merge, whatever they said. "Looks good to me"
          # blocks exactly as "wait, don't" does: a machine that decides which
          # human remarks are approvals has to interpret them, and interpreting
          # is the thing that goes wrong.
          #
          # The test is the AUTHOR, not the words. Bot comments — `in-develop`,
          # the escalation notices, this job's own messages — must not count, or
          # the rule deadlocks on its own output.
          if [ -n "$R" ]; then
            SINCE=$(jq -r '.submitted_at' <<< "$R")
            HUMANS=$(jq -r --arg since "$SINCE" '
                       [.[] | select(.state != "PENDING")
                            | select((.user.login | endswith("[bot]")) | not)
                            | select(.submitted_at > $since)
                            | "review (" + .state + ") by " + .user.login] | .[]' <<< "$REVIEWS")
            # Piped to jq, not `gh api --jq`: gh's built-in filter takes no
            # `--arg`, so `--jq --arg since ...` parses as the filter being the
            # literal string "--arg". It would have failed loudly here, but only
            # because the filter was then invalid — a subtler one would have
            # silently matched nothing.
            HUMANC=$(gh api "repos/$REPO/issues/$PR/comments" \
                     | jq -r --arg since "$SINCE" '
                         [.[] | select((.user.login | endswith("[bot]")) | not)
                              | select(.created_at > $since)
                              | "comment by " + .user.login] | .[]' 2>/dev/null || true)
            WHO=$(printf '%s\n%s\n' "$HUMANS" "$HUMANC" | grep -v '^$' || true)
            if [ -n "$WHO" ]; then
              gh pr edit "$PR" --repo "$REPO" --add-label needs:human
              gh pr ready "$PR" --repo "$REPO"
              printf '%s\n\n%s\n' \
                "Not merging: a person has written on this pull request since the reviewer's verdict, so it is theirs to finish (ADR 0013)." \
                "$WHO" > "$RUNNER_TEMP/human.md"
              gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/human.md"
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ── ADR 0009, guard 2. A verdict is about one commit. If the branch
          # has been pushed to since the reviewer read it, this verdict says
          # nothing about what would actually merge.
          #
          # The prototype found the loop this prevents — a branch someone keeps
          # pushing to bounces between review and gate forever — at roughly one
          # random walk in twenty thousand. So it gets its own small budget, and
          # `0009` is explicit that it spends no STRIKE: nothing was wrong with
          # the work, the work simply moved.
          #
          # Only the `merge` path is guarded. `rework` and `unsure` end in a
          # label, not an action on a commit, and re-labelling is idempotent.
          #
          # An equality test since `0012`. It used to match a seven-character
          # prefix against whatever the model had written, because the role file
          # asks for a SHA and not for a format — a guard whose precision was
          # capped by a model's prose. `commit_id` is GitHub's own record of
          # what was reviewed.
          if [ "$V" = "merge" ] && [ "$AT" != "$HEAD" ]; then
            N=$(jq -r '[.labels[].name | select(startswith("stale:"))]
                       | map(sub("stale:";"") | tonumber) | max // 0' <<< "$PRJSON")
            NEXT=$((N + 1))
            if [ "$NEXT" -gt 3 ]; then
              gh pr edit "$PR" --repo "$REPO" --add-label needs:human
              gh pr ready "$PR" --repo "$REPO"
              gh pr comment "$PR" --repo "$REPO" --body \
                "The verdict has gone stale $N times — the branch is pushed to faster than it can be reviewed. A human should look (ADR 0009, guard 2)."
            else
              # An `if`, not `[ ... ] && ...` — see `NOTES.md` 24.
              if [ "$N" -gt 0 ]; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "stale:$N"
              fi
              gh pr edit "$PR" --repo "$REPO" --add-label "stale:$NEXT"
              gh pr comment "$PR" --repo "$REPO" --body \
                "Not merging: the latest verdict is for a commit that is no longer the head ($HEAD). The push that replaced it starts its own CI run, and the review of that commit decides (ADR 0009, guard 2)."
            fi
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$V" in
            merge)
              # The work is good, so the consecutive strike count resets.
              #
              # Read the labels once and remove only the ones actually present,
              # in a single call. The obvious version — five blind removes in a
              # loop — costs five API writes to do the work of nought or one,
              # and four of them 422. That matters: the secondary rate limit is
              # 80 content-generating requests a minute, 500 an hour, and it is
              # shared across every job in the repository.
              # `stale:` resets here too. It counts races with a pusher, and a
              # verdict that finally names the head means the race is over.
              REMOVE=$(jq -r '[.labels[].name
                               | select(startswith("strike:") or startswith("stale:"))]
                              | join(",")' <<< "$PRJSON")
              if [ -n "$REMOVE" ]; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
              fi
              echo "reviewed=$AT" >> "$GITHUB_OUTPUT"
              echo "go=true" >> "$GITHUB_OUTPUT" ;;
            rework)
              gh pr edit "$PR" --repo "$REPO" --add-label needs:rework
              echo "go=false" >> "$GITHUB_OUTPUT" ;;
            unsure|"")
              gh pr edit "$PR" --repo "$REPO" --add-label needs:human
              gh pr ready "$PR" --repo "$REPO"
              gh pr comment "$PR" --repo "$REPO" --body \
                "The reviewer was unsure, or submitted no review at all. A human should look (ADR 0006)."
              echo "go=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The deterministic half of ADR 0006's escalation list. No model involved,
      # and no tokens spent on a change that was never mergeable by an agent.
      - name: Escalate on authority, without a model
        if: needs.triage.outputs.risky == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          REASONS: ${{ needs.triage.outputs.reasons }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --add-label needs:human
          gh pr ready "$PR" --repo "$REPO"
          printf '%s\n\n%s\n' \
            "Escalated without review — this diff carries authority an agent may not self-approve (ADR 0006)." \
            "$REASONS" > "$RUNNER_TEMP/body.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"

      # Role instructions, shared Pi config and AGENTS.md — never the source code.
      #
      # `AGENTS.md` is checked out because `reviewer.md` step 5 tells this role
      # to read it: "the repository's own conventions and its accumulated
      # corrections. A finding recorded there has already been made once." It was
      # not in this list, so the reviewer was told to read a file it did not
      # have, found nothing, and said nothing about finding nothing
      # (`NOTES.md` 41). The gatekeeper has the same instruction and had the same
      # hole.
      #
      # It is not source. `0004` forbids this role reading a local worktree of
      # the change under review; AGENTS.md is a repository convention document
      # and comes from the DEFAULT BRANCH like the role files, so a pull request
      # cannot rewrite the standards it is judged against.
      # ADR 0004 forbids this role reading a local worktree, and a sparse
      # checkout of these two paths keeps that intact while making --skill
      # resolvable. It also comes from the DEFAULT BRANCH in a workflow_run job,
      # which is the property we want: a pull request cannot rewrite the
      # instructions of the role that judges it.
      - uses: actions/checkout@v5
        if: steps.verdict.outputs.go == 'true'
        with:
          sparse-checkout: |
            .agents
            .pi
            AGENTS.md
            scripts/pi-driver.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        if: steps.verdict.outputs.go == 'true'
        with:
          node-version: 22
      - name: Install Pi
        if: steps.verdict.outputs.go == 'true'
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Merge or escalate
        if: steps.verdict.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          REVIEWED: ${{ steps.verdict.outputs.reviewed }}
          # This role registers no submit tool, and says so on stderr. Its
          # finish is a merge or an escalation — both `gh` calls the driver's
          # --done check can see directly.
          PI_ROLE: gatekeeper
          PI_OFFLINE: "1"
        run: |
          # Refuse to run an agent with no role instructions. `--skill` used to
          # fail silently here and two runs went out with none (`NOTES.md` 25).
          test -s .agents/gatekeeper.md \
            || { echo "::error::.agents/gatekeeper.md is missing or empty"; exit 1; }
          test -s .agents/nudge-gatekeeper.md \
            || { echo "::error::.agents/nudge-gatekeeper.md is missing or empty"; exit 1; }
          test -x scripts/pi-driver.py \
            || { echo "::error::scripts/pi-driver.py missing from the sparse checkout"; exit 1; }
          test -s AGENTS.md \
            || { echo "::error::AGENTS.md is not in the checkout — this role is told to read it"; exit 1; }
          echo "role instructions: $(wc -c < .agents/gatekeeper.md) bytes"

          cat > "$RUNNER_TEMP/prompt.md" <<PROMPT
          Decide whether pull request #$PR in $REPO merges to develop,
          following .agents/gatekeeper.md.

          The reviewer's review was submitted against commit $REVIEWED.
          If you merge, pin the merge to it:

              gh pr merge $PR --repo $REPO --match-head-commit $REVIEWED

          GitHub then refuses the merge itself if the head has moved since the
          review, so the commit that merges is always the commit that was read.

          That file holds when to merge, when to escalate, and the exact
          commands that end the run either way. There is no third ending.
          PROMPT

          # The driver, for the same reason the implementer has one: `pi` exits
          # 0 when the task fails (`NOTES.md` 1). On 2026-09-15 this step's
          # model died on three consecutive provider 429s and the step still
          # reported success — the only reason anyone noticed was the safety net
          # below. The driver makes that a red step, and gives the agent another
          # turn before it gets there.
          #
          # The predicate is the SAME script the safety net runs, so "finished"
          # means one thing in this job, not two.
          python3 scripts/pi-driver.py \
            --prompt-file "$RUNNER_TEMP/prompt.md" \
            --nudge-file .agents/nudge-gatekeeper.md \
            --done "bash $RUNNER_TEMP/gatekeeper-done.sh" \
            --max-nudges 2 \
            --idle-timeout 300 \
            --timeout 900 \
            --log "$RUNNER_TEMP/rpc.jsonl" \
            -- pi --mode rpc --approve \
                  --append-system-prompt "$(cat .agents/gatekeeper.md)" \
                  --model "${{ vars.GATEKEEP_MODEL }}" \
                  --tools read,grep,find,ls,bash

      # Silence is the one outcome not allowed. On the Hermes rig a reviewer
      # twice decided privately that a human should handle something and then
      # stopped, which from GitHub is indistinguishable from a clean merge.
      - name: No silent outcomes
        if: always() && needs.triage.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The same predicate the driver used. One definition of "has an
          # outcome", and it counts a queued merge as one — see the step that
          # writes it.
          if bash "$RUNNER_TEMP/gatekeeper-done.sh"; then
            exit 0
          fi

          # GitHub may have refused the merge because develop moved under us
          # while this job was running. That is rework, not a human's problem.
          if [ "$(gh pr view "$PR" --repo "$REPO" --json mergeable -q '.mergeable')" = "CONFLICTING" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label needs:rework
            gh pr comment "$PR" --repo "$REPO" \
              --body "GitHub refused the merge: conflicts with develop. Back to the implementer (ADR 0009)."
            exit 0
          fi

          gh pr edit "$PR" --repo "$REPO" --add-label needs:human
          gh pr comment "$PR" --repo "$REPO" \
            --body "The gatekeeper ended without merging or escalating. A human should look. $RUN"
