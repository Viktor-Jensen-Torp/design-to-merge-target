# The review and gatekeep jobs.
#
# ADR 0004 shapes the trigger entirely: CI green is a precondition for review,
# not a finding of it. workflow_run gives that for free — this cannot start
# before CI finishes, and the conclusion is in the event.
#
# ADR 0006 shapes the jobs: the reviewer returns a verdict and holds no
# authority; a separate gatekeeper merges or escalates. ADR 0012 says what a
# verdict is MADE OF: a GitHub review, whose `state` is the decision and whose
# `commit_id` is the commit judged. Nothing here parses a verdict out of prose. Two jobs rather than two
# workflows, deliberately — each still gets its own App, model and skill file,
# but there is no second trigger to misfire and no extra link in a workflow_run
# chain (which caps at three levels, NOTES.md section 7).
#
# Goes in the TARGET repo at .github/workflows/review.yml.
#
# Requires, in the target repo:
#   vars.REVIEWER_CLIENT_ID    secrets.REVIEWER_APP_PRIVATE_KEY
#   vars.GATEKEEPER_CLIENT_ID  secrets.GATEKEEPER_APP_PRIVATE_KEY
#   secrets.OPENROUTER_API_KEY
#   vars.REVIEW_MODEL              vars.GATEKEEP_MODEL

name: Review

on:
  workflow_run:
    workflows: ["CI"]            # must match the `name:` of the test workflow
    types: [completed]

permissions:
  contents: read

# `0020`: only the latest commit counts. When CI completes again for the same
# branch, a newer commit is being judged, and a review of the old one would only
# be thrown away at the end. Cancelling it saves the run. `workflow_run` runs are
# not checks on the pull request, so this should leave no red mark on it
# (`NOTES.md` 33); that is unverified until one is seen.
concurrency:
  group: review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  # ── Find the pull request, and turn a red build back without spending a token
  triage:
    # CI also runs on `push` to develop, where there is no pull request to find.
    # Without this the job goes red on every merge (NOTES.md section 18).
    if: github.event.workflow_run.event != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.pr.outputs.number }}
      # The commit this whole run is about (`0020`): the one CI judged. Every
      # later job reads, reviews and routes on this, never on "the head now".
      sha: ${{ github.event.workflow_run.head_sha }}
      green: ${{ steps.pr.outputs.green }}
      blocked: ${{ steps.conflict.outputs.blocked }}
      risky: ${{ steps.risk.outputs.risky }}
      reasons: ${{ steps.risk.outputs.reasons }}
      reviewed: ${{ steps.already.outputs.reviewed }}
      # `0013`: the verdict is the last review BY THE REVIEWER APP, not by any
      # bot. This job already holds the reviewer's token, so its login is free
      # here; `gatekeep` mints the GATEKEEPER's token and cannot derive it.
      reviewer: ${{ steps.token.outputs.app-slug }}[bot]
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      # The one staleness check (`0020`), from develop like every other script
      # (`0019`). Nothing else is checked out here.
      - uses: actions/checkout@v5
        with:
          ref: develop
          sparse-checkout: |
            scripts/still-current.sh
          sparse-checkout-cone-mode: false

      # A CANCELLED CI run is not a red build. `ci.yml` cancels the run in
      # flight when a new commit is pushed, so a perfectly good pull request
      # whose author pushes twice in quick succession produces a cancelled run —
      # and this workflow used to read "not success" as red, comment "CI is red",
      # label `needs:rework` and spend a STRIKE on work that was never wrong
      # (`NOTES.md` 37, found by the guard 2 spike).
      #
      # A cancellation means a newer run is already coming. The right move is to
      # do nothing and let that run's chain decide — the same reasoning as guard
      # 2 declining a stale verdict. `skipped` is the same case.
      #
      # This is the second time a cancelled run has been mistaken for a failed
      # one (`NOTES.md` 33 was the first, on a release pull request's checks).
      # The general form is worth keeping: **cancelled is not failed, and
      # nothing in this pipeline should treat it as a verdict.**
      - name: A cancelled run is not a red build
        id: cancelled
        run: |
          C='${{ github.event.workflow_run.conclusion }}'
          case "$C" in
            cancelled|skipped)
              echo "CI run was $C — a newer run is coming, nothing to decide here."
              echo "stop=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "stop=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # A pull request dropped from the merge queue is handled by dequeued.yml,
      # not here. This step used to watch for a FAILED merge-group CI run, but a
      # textual clash with the entry ahead produces no CI run at all, so that
      # case never reached the pipeline (#101, `NOTES.md` 80). It also sent any
      # pull request back, not only an agent's, with the wrong task and a strike.

      # workflow_run's `pull_requests` payload is documented as NOT necessarily
      # indicating the PR that triggered the run, so it is not used here.
      - name: Find the pull request
        id: pr
        if: steps.cancelled.outputs.stop != 'true'
          && !startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/')
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          NUM=$(gh pr list --repo "$REPO" --search "$SHA" --state open \
                  --json number,labels \
                  --jq '.[] | select(.labels[].name == "agent") | .number' | head -1)
          if [ -z "$NUM" ]; then
            echo "No agent pull request for $SHA — nothing to do."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `0020`: CI judged $SHA. If the pull request has moved on, the newer
          # commit's own CI run decides, and this one stops quietly.
          C=$(bash scripts/still-current.sh "$NUM" "$SHA") || { echo "::error::could not check #$NUM"; exit 1; }
          if [ "$C" != "current=true" ]; then
            echo "Stale: this run is about a commit that is no longer the head. Nothing to do."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      # ADR 0009 — we never detect conflicts ourselves except here, cheaply,
      # to avoid paying for a review of a diff that is about to change anyway.
      # The authoritative refusal still comes from GitHub at the merge attempt.
      - name: A conflicted pull request is reworked, not reviewed
        id: conflict
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          M=$(gh pr view "$PR" --repo "$REPO" --json mergeable -q '.mergeable')
          # Checked again right before acting (`0020`).
          if [ "$M" = "CONFLICTING" ] && [ "$(bash scripts/still-current.sh "$PR" "$SHA")" = "current=true" ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body "Conflicts with develop. Back to the implementer before review (ADR 0009)."
            gh pr edit "$PR" --repo "$REPO" --add-label needs:rework
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Red build goes back
        if: steps.pr.outputs.number != '' && steps.pr.outputs.green != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Checked again right before acting (`0020`): red CI on an old commit
          # says nothing about the new one.
          if [ "$(bash scripts/still-current.sh "$PR" "$SHA")" != "current=true" ]; then
            echo "Stale: a newer commit has its own CI run. Nothing to do."
            exit 0
          fi
          gh pr comment "$PR" --repo "$REPO" \
            --body "CI is red. Back to the implementer without review (ADR 0004)."
          gh pr edit "$PR" --repo "$REPO" --add-label needs:rework

      # ADR 0006: most of the escalation list is authority, not correctness, and
      # authority is a grep over changed paths. Run it deterministically so the
      # cheap, reliable escalations never depend on a model noticing.
      # Reviewing is not idempotent, and CI can complete more than once for the
      # same commit — a re-run, a `merge_group` build, a retried job. On
      # 2026-09-17 a CI re-run sent the reviewer at a pull request it had
      # already APPROVED; it came back COMMENTED, the router read the LAST
      # review, and an approved change was escalated to a human (`NOTES.md` 53).
      #
      # A verdict is about a commit. If one already exists for this exact head,
      # the question has been answered and asking again can only disagree.
      - name: Has this head already been judged?
        id: already
        if: steps.pr.outputs.number != '' && steps.pr.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          REVIEWER: ${{ steps.token.outputs.app-slug }}[bot]
          HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          R=$(gh api "repos/$REPO/pulls/$PR/reviews" \
                --jq "[.[] | select(.state != \"PENDING\")
                           | select(.user.login == \"$REVIEWER\")] | last // empty")
          AT=$(jq -r '.commit_id // ""' <<< "${R:-null}")
          if [ -n "$R" ] && [ "$AT" = "$HEAD" ]; then
            echo "A $(jq -r .state <<< "$R") review already exists for $HEAD."
            echo "Skipping the reviewer; the gatekeeper acts on the verdict that exists."
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No verdict for $HEAD yet."
            echo "reviewed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deterministic risk check
        id: risk
        if: steps.pr.outputs.number != '' && steps.pr.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          FILES=$(gh pr diff "$PR" --repo "$REPO" --name-only)
          REASONS=""
          grep -qE '^\.github/'                      <<< "$FILES" && REASONS="$REASONS- touches .github/ (root of trust)\n"
          grep -qE '(^|/)CODEOWNERS$'                <<< "$FILES" && REASONS="$REASONS- touches CODEOWNERS\n"
          grep -qE '(^|/)AGENTS\.md$'                <<< "$FILES" && REASONS="$REASONS- touches AGENTS.md\n"
          grep -qE '(^|/)\.agents/'                  <<< "$FILES" && REASONS="$REASONS- touches agent role instructions\n"
          grep -qE '(^|/)\.githooks/'                <<< "$FILES" && REASONS="$REASONS- touches the local gates\n"
          # `.pi/` is root of trust too, and was missed until the docs audit on
          # 2026-09-16. `.pi/extensions/submit.ts` is the code that decides
          # whether a role's work is acceptable, and extensions run with full
          # system permissions inside the job (`security.md`). An agent editing
          # its own finish condition must not pass unnoticed.
          grep -qE '(^|/)\.pi/'                      <<< "$FILES" && REASONS="$REASONS- touches .pi/ (Pi config and extensions, root of trust)\n"
          grep -qE '(^|/)(package\.json|pnpm-lock\.yaml)$' <<< "$FILES" && REASONS="$REASONS- changes dependencies (ADR 0002)\n"
          # The gate DEFINITIONS. `.github/` above protects the CI workflow, so
          # the `test` job cannot be removed — these decide what it checks when
          # it runs. An `ignores` in the eslint config or an `exclude` in the
          # vitest config is a loosened gate that reports green.
          grep -qE '(^|/)(eslint\.config\.[a-z]+|tsconfig([.][a-z]+)?\.json|vitest\.config\.[a-z]+|\.prettierignore)$' \
            <<< "$FILES" && REASONS="$REASONS- touches a gate definition (lint/types/tests/format config)\n"
          if [ -n "$REASONS" ]; then
            echo "risky=true" >> "$GITHUB_OUTPUT"
            { echo "reasons<<EOF"; printf "%b" "$REASONS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "risky=false" >> "$GITHUB_OUTPUT"
          fi

  # ── The verdict. No authority: this token cannot merge, and this job's only
  #    side effect is a comment.
  review:
    needs: triage
    # `reviewed` is triage's answer to "has this exact head already been
    # judged?". Skipping here rather than in `gatekeep` is the whole point: the
    # verdict that exists stays the verdict, and the gatekeeper still runs and
    # acts on it. Guarding the gatekeeper instead would mean a re-run merges
    # nothing at all.
    if: needs.triage.outputs.number != '' && needs.triage.outputs.green == 'true'
        && needs.triage.outputs.blocked != 'true'
        && needs.triage.outputs.reviewed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      # `0021`: the reviewer reads the commit it judges. A fresh checkout of
      # exactly the commit CI passed (`0020`), never "the branch now". `0004`'s
      # failure was a stale LOCAL copy the agent had worked in; this is the
      # pushed commit, which is the remote. The reviewer runs in this folder and
      # can search the whole repository.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.triage.outputs.sha }}
          path: code
          persist-credentials: false

      # Instructions, tools and Pi config from develop (`0019`), in their own
      # folder. Pi loads nothing from the pull request's .pi/ (see the run step).
      - uses: actions/checkout@v5
        with:
          ref: develop
          path: pipeline
          sparse-checkout: |
            .agents
            .pi
            scripts/pi-driver.py
            scripts/still-current.sh
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pi, the two binaries its grep and find tools need, and models.json where
      # Pi reads it. All asserted, because each fails silently otherwise.
      #
      # - ripgrep and fd are not on the Ubuntu runner (runner-images' Ubuntu
      #   24.04 readme), and PI_OFFLINE=1 stops Pi downloading them
      #   (tools-manager.js). Without them Pi's grep and find tools fail for
      #   every role (`NOTES.md` 76). Ubuntu's fd is `fdfind`, which Pi looks for.
      # - Pi reads models.json only from ~/.pi/agent, never from a project's
      #   .pi/. Until 2026-09-18 no role's sampling or routing reached the wire
      #   (`NOTES.md` 72). And a model missing from Pi's catalogue silently runs
      #   as a copy of another model, with none of its settings.
      # - settings.json goes there too: the run passes --no-approve, so the pull
      #   request's project settings are never read (`NOTES.md` 82).
      - name: Install Pi, its search tools and its model config
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ vars.REVIEW_MODEL }}
        run: |
          npm install -g @earendil-works/pi-coding-agent
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep fd-find > /dev/null
          command -v rg > /dev/null && command -v fdfind > /dev/null \
            || { echo "::error::ripgrep or fd is missing, so Pi's grep and find tools would fail"; exit 1; }
          mkdir -p ~/.pi/agent
          cp pipeline/.pi/models.json ~/.pi/agent/models.json
          cp pipeline/.pi/settings.json ~/.pi/agent/settings.json
          pi --list-models openrouter < /dev/null > "$RUNNER_TEMP/models.txt" 2>&1 || true
          grep -qF -- "$MODEL" "$RUNNER_TEMP/models.txt" \
            || { echo "::error::Pi does not know $MODEL. It would run as a copy of another model, with none of its settings (NOTES.md 72). Declare it under models in .pi/models.json."; exit 1; }
          echo "Pi knows $MODEL; ripgrep and fd are installed"

      # WHEN IS A REVIEW FINISHED?
      #
      # When the reviewer App has a review on THIS run's commit (`0012`: the
      # verdict is a review, and GitHub records its `commit_id`). "A review
      # exists" would be true before the run on any rework round
      # (`NOTES.md` 27), and "about the head now" could be a different commit.
      #
      # Or when that commit is no longer the head (`0020`): the review was
      # rightly not posted, and the newer commit gets its own.
      - name: Define what a finished review means
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.triage.outputs.sha }}
          REVIEWER: ${{ needs.triage.outputs.reviewer }}
          STILL: ${{ github.workspace }}/pipeline/scripts/still-current.sh
        run: |
          cat > "$RUNNER_TEMP/review-done.sh" <<DONE
          set -u
          if [ "\$(REPO="$REPO" bash "$STILL" "$PR" "$SHA")" = "current=false" ]; then
            echo "Stale: ${SHA:0:7} is no longer the head of #$PR, so there is nothing to post."
            exit 0
          fi
          AT=\$(gh api "repos/$REPO/pulls/$PR/reviews" \
                 --jq '[.[] | select(.state != "PENDING") | select(.user.login == "$REVIEWER")] | last | .commit_id // ""')
          if [ "\$AT" != "$SHA" ]; then
            echo "No review from $REVIEWER on ${SHA:0:7} yet (its latest is on \${AT:0:7})."
            exit 1
          fi
          echo "A review of ${SHA:0:7} is posted."
          DONE
          chmod +x "$RUNNER_TEMP/review-done.sh"

      - name: Review the pull request
        working-directory: code
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.triage.outputs.sha }}
          P: ${{ github.workspace }}/pipeline
          # Read by .pi/extensions/submit.ts: which submit tool to register,
          # which pull request it posts to, the commit the review is about
          # (`0020`), and the one staleness check it runs before posting.
          # PI_HEAD_SHA also turns on the quote check (`0021`).
          PI_ROLE: reviewer
          PI_PR: ${{ needs.triage.outputs.number }}
          PI_REPO: ${{ github.repository }}
          PI_HEAD_SHA: ${{ needs.triage.outputs.sha }}
          PI_STILL_CURRENT: ${{ github.workspace }}/pipeline/scripts/still-current.sh
          PI_OFFLINE: "1"
        run: |
          # Refuse to run an agent with no role instructions, and refuse to run
          # without any extension: they are loaded one by one with -e below, and
          # a missing file would otherwise be a missing guard (`NOTES.md` 25, 81).
          for f in .agents/reviewer.md .agents/nudge-reviewer.md scripts/pi-driver.py \
                   .pi/extensions/submit.ts .pi/extensions/protect.ts .pi/extensions/sanity.ts \
                   .pi/extensions/permission-gate.ts .pi/extensions/debug.ts; do
            test -s "$P/$f" || { echo "::error::$f missing from develop"; exit 1; }
          done
          test "$(git rev-parse HEAD)" = "$SHA" \
            || { echo "::error::the checkout is not the commit under review"; exit 1; }
          echo "role instructions: $(wc -c < "$P/.agents/reviewer.md") bytes, reviewing ${SHA:0:7}"

          # `0021`: the reviewer judges the code as it is, not its own earlier
          # reviews. On round 2 of #96 it repeated its previous review word for
          # word about a line already removed (`NOTES.md` 83). What a PERSON
          # wrote is given here in full, so it has no reason to go reading the
          # review history; a finding that still matters is found again in
          # the code.
          PEOPLE=$( { gh api "repos/$REPO/issues/$PR/comments" --paginate \
                        --jq '.[] | select(.user.type != "Bot") | "- " + .user.login + ": " + .body' ;
                      gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                        --jq '.[] | select(.user.type != "Bot") | select(.body != "") | "- " + .user.login + " (review, " + .state + "): " + .body' ; } 2>/dev/null || true)
          if [ -n "$PEOPLE" ]; then
            PEOPLE="What people have written on this pull request. It outranks anything an agent wrote:
          $PEOPLE"
          else
            PEOPLE="No person has written on this pull request."
          fi

          # Line threads a PERSON resolved are settled (`NOTES.md` 79): the
          # reviewer must not raise them again. Only GraphQL says whether a
          # thread is resolved. `resolvedBy` is typed `User`, never a bot, so
          # "resolved with a user named" means a person resolved it. Same rule
          # as rework.yml.
          SETTLED=$(gh api graphql \
                      -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{isResolved resolvedBy{login} path line originalLine comments(first:1){nodes{body}}}}}}}' \
                      -f o="${REPO%/*}" -f r="${REPO#*/}" -F n="$PR" \
                      --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                            | select(.isResolved and .resolvedBy != null)
                            | "- `" + .path + ":" + ((.line // .originalLine) | tostring) + "`, resolved by "
                              + .resolvedBy.login + ": " + (.comments.nodes[0].body | split("\n")[0])' 2>/dev/null || true)
          if [ -n "$SETTLED" ]; then
            SETTLED="A person resolved these line comments, so they are settled. Do not raise them
          again, and do not count them as unresolved:
          $SETTLED"
          fi

          # A prompt carries what the role file cannot know (`NOTES.md` 57): the
          # commit, that it is checked out here, and what people said.
          cat > "$RUNNER_TEMP/prompt.md" <<PROMPT
          Review pull request #$PR in $REPO, at commit $SHA.

          That commit is checked out in your working directory: the whole
          repository as it is at that commit, not only the diff. Read it, search
          it, and compare the change with how the rest of the code does things.
          Judge the code as it is now. Do not read your own earlier reviews of
          this pull request: a finding that still matters, you will find again
          in the code.

          $PEOPLE

          $SETTLED
          PROMPT

          # The driver, for the same reason every role has one: `pi` exits 0
          # when the task fails (`NOTES.md` 1).
          # --no-approve --no-extensions -e: the working directory is the pull
          # request's code, so its .pi/ must never load. The extensions come from
          # develop, one by one (`NOTES.md` 82).
          # --no-skills: the human skills in .agents/skills/ (`0015`) are for
          # people's harnesses.
          # --provider openrouter: `--model` reads `provider/id` (`NOTES.md` 70).
          # --tools is an allowlist: a denylist silently grants a tool Pi gains.
          # This is hygiene, not a control; the control is that this App has no
          # merge rights.
          python3 "$P/scripts/pi-driver.py" \
            --prompt-file "$RUNNER_TEMP/prompt.md" \
            --nudge-file "$P/.agents/nudge-reviewer.md" \
            --done "bash $RUNNER_TEMP/review-done.sh" \
            --max-nudges 2 \
            --idle-timeout 600 \
            --timeout 1500 \
            --log "$RUNNER_TEMP/rpc.jsonl" \
            -- pi --mode rpc --no-approve --no-extensions --no-skills --provider openrouter \
                  -e "$P/.pi/extensions/submit.ts" -e "$P/.pi/extensions/protect.ts" \
                  -e "$P/.pi/extensions/sanity.ts" -e "$P/.pi/extensions/permission-gate.ts" \
                  -e "$P/.pi/extensions/debug.ts" \
                  --append-system-prompt "$(cat "$P/.agents/reviewer.md")" \
                  --model "${{ vars.REVIEW_MODEL }}" \
                  --tools read,grep,find,ls,bash,submit_review

      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpc-reviewer-pr-${{ needs.triage.outputs.number }}
          path: ${{ runner.temp }}/rpc.jsonl
          if-no-files-found: warn
          retention-days: 7

  # ── The authority. The only role that can merge.
  gatekeep:
    needs: [triage, review]
    # `!cancelled()`, because the reviewer's step can now FAIL rather than
    # quietly producing nothing. Without it a failed review skips this job and
    # the pull request is orphaned: no verdict, no label, nobody listening —
    # the silent outcome ADR 0006 exists to forbid, reintroduced by the very
    # change that made failures visible.
    #
    # With it, "Route on the verdict" finds no verdict, reads that as `unsure`,
    # and labels `needs:human`. A review that could not run is a human's
    # problem, and now says so.
    if: ${{ !cancelled()
        && needs.triage.outputs.number != '' && needs.triage.outputs.green == 'true'
        && needs.triage.outputs.blocked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `concurrency: merge` here. ADR 0010 — `develop` requires a merge queue,
    # so GitHub serialises. `gh pr merge` enqueues rather than merging, and the
    # queue builds each entry against the base plus everything ahead of it.
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.GATEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.GATEKEEPER_APP_PRIVATE_KEY }}

      # Role instructions, shared Pi config, AGENTS.md and the scripts, from
      # develop (`0019`), never the code under review: a pull request cannot
      # rewrite what judges it. AGENTS.md because the role file tells it to
      # read the conventions (`NOTES.md` 41). At the start, not only on the merge
      # path, because the staleness check (`0020`) is needed before anything.
      - uses: actions/checkout@v5
        with:
          ref: develop
          sparse-checkout: |
            .agents
            .pi
            AGENTS.md
            scripts/pi-driver.py
            scripts/still-current.sh
          sparse-checkout-cone-mode: false

      # ADR 0006 allows no third ending. This says what the endings ARE, once,
      # and two things read it: the driver that will not let the agent stop
      # without one, and the safety net that fires if it stopped anyway.
      # Written here rather than in either consumer because a condition stated
      # in two places is a condition that will eventually disagree with itself.
      #
      # QUEUED is the case this file used to miss. Under a merge queue
      # `gh pr merge` does not merge — it enqueues, and the merge lands minutes
      # later. On 2026-09-15 the gatekeeper enqueued #16 correctly, its next
      # turn died on a provider 429, and this check called it a silent stop and
      # labelled `needs:human` 32 seconds before the queue merged it
      # (`NOTES.md` 29). A gatekeeper that has succeeded must not look like one
      # that did nothing.
      - name: Define what ending the run means
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/gatekeeper-done.sh" <<'DONE'
          set -u
          # `0020`: a run about a commit that is no longer the head has nothing
          # to decide, and ending there is correct. Needs SHA and STILL.
          if [ "$(bash "$STILL" "$PR" "$SHA")" = "current=false" ]; then
            echo "Stale: ${SHA:0:7} is no longer the head of #$PR. Its successor has its own chain."
            exit 0
          fi
          OWNER=${REPO%%/*}; NAME=${REPO##*/}
          J=$(gh pr view "$PR" --repo "$REPO" --json state,labels,autoMergeRequest)
          STATE=$(jq -r '.state' <<< "$J")
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<< "$J")
          AUTO=$(jq -r 'if .autoMergeRequest then "yes" else "no" end' <<< "$J")
          # `isInMergeQueue` is GraphQL-only; `gh pr view` does not expose it.
          Q='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){isInMergeQueue}}}'
          QUEUE=$(gh api graphql -f query="$Q" -F o="$OWNER" -F n="$NAME" -F p="$PR" \
                    --jq '.data.repository.pullRequest.isInMergeQueue' 2>/dev/null || echo unknown)

          case "$STATE" in MERGED|CLOSED) echo "Pull request #$PR is $STATE."; exit 0 ;; esac
          [ "$QUEUE" = "true" ] && { echo "Pull request #$PR is in the merge queue."; exit 0; }
          [ "$AUTO"  = "yes"  ] && { echo "Pull request #$PR is queued to merge (auto-merge enabled)."; exit 0; }
          case ",$LABELS," in
            *,needs:human,*|*,needs:rework,*) echo "Pull request #$PR is labelled: $LABELS"; exit 0 ;;
          esac
          # A `stale:` label is also an ending, and a deliberate one: guard 2
          # declined to merge a verdict for a commit that is no longer the head,
          # said so on the pull request, and left the review of the NEW head to
          # decide. Without this the safety net would call that silence and
          # escalate a pull request that is working exactly as designed.
          case "$LABELS" in
            *stale:*) echo "Pull request #$PR is waiting on a fresh verdict: $LABELS"; exit 0 ;;
          esac

          echo "Pull request #$PR has no outcome."
          echo "  state:        $STATE"
          echo "  labels:       ${LABELS:-none}"
          echo "  in queue:     $QUEUE"
          echo "  auto-merge:   $AUTO"
          echo "It is still open, it is not queued to merge, and it carries neither"
          echo "needs:human nor needs:rework."
          exit 1
          DONE
          chmod +x "$RUNNER_TEMP/gatekeeper-done.sh"

      # ADR 0009 — read the verdict and route on it deterministically. A model
      # is only worth spending when the reviewer actually wants this merged.
      # This also resets the strike count, which is what makes strikes
      # CONSECUTIVE rather than lifetime.
      - name: Route on the verdict
        id: verdict
        if: needs.triage.outputs.risky != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          REVIEWER: ${{ needs.triage.outputs.reviewer }}
          SHA: ${{ needs.triage.outputs.sha }}
        run: |
          # `0020`: this run is about $SHA. If the pull request has moved on,
          # the newer commit's chain decides and this one stops quietly.
          if [ "$(bash scripts/still-current.sh "$PR" "$SHA")" != "current=true" ]; then
            echo "Stale: nothing to route."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One read, reused below. Every `gh pr view` is a round trip.
          PRJSON=$(gh pr view "$PR" --repo "$REPO" --json labels,headRefOid)
          HEAD=$(jq -r '.headRefOid' <<< "$PRJSON")

          # `0012`: the verdict is a REVIEW. Two fields, both recorded by
          # GitHub — `state` is the decision and `commit_id` is what was judged.
          # Nothing here parses prose a model wrote.
          #
          # `0013`: the last review **by the reviewer App**, named exactly —
          # not the last review by anyone, and not the last by any bot. A human
          # leaving a COMMENTED review must not silently become the verdict, and
          # a human approving must not become one either; approving is not how a
          # person authorises a merge here (`0005`).
          #
          # `$REVIEWER` comes from `triage`, which mints the reviewer's token and
          # so knows its login. This job mints the GATEKEEPER's and cannot derive
          # it. Until 2026-09-17 this matched any `[bot]`, which was correct only
          # because the reviewer is the one App that reviews — correct by
          # circumstance rather than by construction, which is what `0013` exists
          # to rule out.
          REVIEWS=$(gh api "repos/$REPO/pulls/$PR/reviews")
          R=$(jq -c --arg who "$REVIEWER" '[.[] | select(.state != "PENDING")
                          | select(.user.login == $who)] | last // empty' <<< "$REVIEWS")
          # `${R:-null}`, not `${R:-{}}` — the closing brace inside the default
          # terminates the expansion early and jq gets malformed input. `null`
          # is valid JSON and `.state // ""` on it gives the empty string.
          RJ=${R:-null}
          AT=$(jq -r '.commit_id // ""' <<< "$RJ")
          # `0020`: only a verdict about this run's commit counts. A review of
          # an older commit (the review job failed, or never ran) is not this
          # commit's verdict, and acting on it would send current work back over
          # an old finding. With no verdict the route is `unsure`: a person.
          if [ "$AT" != "$SHA" ]; then
            R=""; RJ=null
          fi
          case "$(jq -r '.state // ""' <<< "$RJ")" in
            APPROVED)          V=merge ;;
            CHANGES_REQUESTED) V=rework ;;
            COMMENTED)         V=unsure ;;
            *)                 V="" ;;
          esac

          # ── ADR 0013. A human who has written on this pull request since the
          # verdict stops the merge, whatever they said. "Looks good to me"
          # blocks exactly as "wait, don't" does: a machine that decides which
          # human remarks are approvals has to interpret them, and interpreting
          # is the thing that goes wrong.
          #
          # The test is the AUTHOR, not the words. Bot comments — `in-develop`,
          # the escalation notices, this job's own messages — must not count, or
          # the rule deadlocks on its own output.
          if [ -n "$R" ]; then
            SINCE=$(jq -r '.submitted_at' <<< "$R")
            HUMANS=$(jq -r --arg since "$SINCE" '
                       [.[] | select(.state != "PENDING")
                            | select((.user.login | endswith("[bot]")) | not)
                            | select(.submitted_at > $since)
                            | "review (" + .state + ") by " + .user.login] | .[]' <<< "$REVIEWS")
            # Piped to jq, not `gh api --jq`: gh's built-in filter takes no
            # `--arg`, so `--jq --arg since ...` parses as the filter being the
            # literal string "--arg". It would have failed loudly here, but only
            # because the filter was then invalid — a subtler one would have
            # silently matched nothing.
            HUMANC=$(gh api "repos/$REPO/issues/$PR/comments" \
                     | jq -r --arg since "$SINCE" '
                         [.[] | select((.user.login | endswith("[bot]")) | not)
                              | select(.created_at > $since)
                              | "comment by " + .user.login] | .[]' 2>/dev/null || true)
            WHO=$(printf '%s\n%s\n' "$HUMANS" "$HUMANC" | grep -v '^$' || true)
            if [ -n "$WHO" ]; then
              gh pr edit "$PR" --repo "$REPO" --add-label needs:human
              gh pr ready "$PR" --repo "$REPO"
              printf '%s\n\n%s\n' \
                "Not merging: a person has written on this pull request since the reviewer's verdict, so it is theirs to finish (ADR 0013)." \
                "$WHO" > "$RUNNER_TEMP/human.md"
              gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/human.md"
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ── ADR 0009, guard 2. A verdict is about one commit. If the branch
          # has been pushed to since the reviewer read it, this verdict says
          # nothing about what would actually merge.
          #
          # The prototype found the loop this prevents — a branch someone keeps
          # pushing to bounces between review and gate forever — at roughly one
          # random walk in twenty thousand. So it gets its own small budget, and
          # `0009` is explicit that it spends no STRIKE: nothing was wrong with
          # the work, the work simply moved.
          #
          # Only the `merge` path is guarded. `rework` and `unsure` end in a
          # label, not an action on a commit, and re-labelling is idempotent.
          #
          # An equality test since `0012`. It used to match a seven-character
          # prefix against whatever the model had written, because the role file
          # asks for a SHA and not for a format — a guard whose precision was
          # capped by a model's prose. `commit_id` is GitHub's own record of
          # what was reviewed.
          if [ "$V" = "merge" ] && [ "$AT" != "$HEAD" ]; then
            N=$(jq -r '[.labels[].name | select(startswith("stale:"))]
                       | map(sub("stale:";"") | tonumber) | max // 0' <<< "$PRJSON")
            NEXT=$((N + 1))
            if [ "$NEXT" -gt 3 ]; then
              gh pr edit "$PR" --repo "$REPO" --add-label needs:human
              gh pr ready "$PR" --repo "$REPO"
              gh pr comment "$PR" --repo "$REPO" --body \
                "The verdict has gone stale $N times — the branch is pushed to faster than it can be reviewed. A human should look (ADR 0009, guard 2)."
            else
              # An `if`, not `[ ... ] && ...` — see `NOTES.md` 24.
              if [ "$N" -gt 0 ]; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "stale:$N"
              fi
              gh pr edit "$PR" --repo "$REPO" --add-label "stale:$NEXT"
              gh pr comment "$PR" --repo "$REPO" --body \
                "Not merging: the latest verdict is for a commit that is no longer the head ($HEAD). The push that replaced it starts its own CI run, and the review of that commit decides (ADR 0009, guard 2)."
            fi
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$V" in
            merge)
              # The work is good, so the consecutive strike count resets.
              #
              # Read the labels once and remove only the ones actually present,
              # in a single call. The obvious version — five blind removes in a
              # loop — costs five API writes to do the work of nought or one,
              # and four of them 422. That matters: the secondary rate limit is
              # 80 content-generating requests a minute, 500 an hour, and it is
              # shared across every job in the repository.
              # `stale:` resets here too. It counts races with a pusher, and a
              # verdict that finally names the head means the race is over.
              REMOVE=$(jq -r '[.labels[].name
                               | select(startswith("strike:") or startswith("stale:"))]
                              | join(",")' <<< "$PRJSON")
              if [ -n "$REMOVE" ]; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
              fi
              # The implementer opens the pull request as a DRAFT, and GitHub
              # refuses to enqueue a draft. The `unsure` and `rework` branches
              # below already promote it; this one did not, because the
              # gatekeeper used to run `gh pr ready` itself. That was removed on
              # 2026-09-17 as a no-op, on the strength of a log line from a run
              # where an `unsure` verdict had already promoted the pull request
              # — so on the very next merge GitHub answered "Pull request is a
              # draft" and the role escalated (`NOTES.md` 52).
              #
              # Promoting a pull request is not a judgement, so it belongs here
              # rather than in a role file.
              gh pr ready "$PR" --repo "$REPO"
              echo "reviewed=$AT" >> "$GITHUB_OUTPUT"
              echo "verdict=$V" >> "$GITHUB_OUTPUT"
              echo "go=true" >> "$GITHUB_OUTPUT" ;;
            rework)
              gh pr edit "$PR" --repo "$REPO" --add-label needs:rework
              echo "go=false" >> "$GITHUB_OUTPUT" ;;
            unsure|"")
              gh pr edit "$PR" --repo "$REPO" --add-label needs:human
              # Edit our own previous escalation rather than adding another.
              # Three failed runs on #54 left three identical comments, and the
              # next reviewer read them all as current context
              # (`NOTES.md` 51). An escalation is a state,
              # not an event log.
              MARK="<!-- escalation:reviewer-unsure -->"
              # A COMMENT review is the reviewer asking a person something
              # (`0018`): quote its questions here, so the person arrives at
              # them rather than hunting through the review.
              QUESTIONS=$(printf '%s' "${RJ:-}" | jq -r '.body // empty' 2>/dev/null \
                            | awk '/^## Questions for a person/{f=1; next} /^## /{f=0} f && NF')
              if [ -n "$QUESTIONS" ]; then
                WHY="The reviewer has questions only a person can answer, so this has stopped here until one does (ADR 0018):

          $QUESTIONS"
              else
                WHY="The reviewer was unsure, or submitted no review at all. A human should look (ADR 0006)."
              fi
              BODY="$MARK
          $WHY

          To continue, answer on this pull request, then either swap \`needs:human\` for \`needs:rework\` so the implementer carries on with your answer in the thread, or handle it yourself.

          Last checked: $(date -u +%Y-%m-%dT%H:%M:%SZ), run $GITHUB_RUN_ID."
              EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
                           --jq "[.[] | select(.body | contains(\"$MARK\"))] | last // empty" \
                         | jq -r '.id // empty')
              if [ -n "$EXISTING" ]; then
                gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" --silent
                echo "updated the existing escalation comment ($EXISTING)"
              else
                gh pr comment "$PR" --repo "$REPO" --body "$BODY"
              fi
              echo "go=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The deterministic half of ADR 0006's escalation list. No model involved,
      # and no tokens spent on a change that was never mergeable by an agent.
      - name: Escalate on authority, without a model
        if: needs.triage.outputs.risky == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          REASONS: ${{ needs.triage.outputs.reasons }}
          SHA: ${{ needs.triage.outputs.sha }}
        run: |
          if [ "$(bash scripts/still-current.sh "$PR" "$SHA")" != "current=true" ]; then
            echo "Stale: a newer commit has its own chain (0020)."
            exit 0
          fi
          gh pr edit "$PR" --repo "$REPO" --add-label needs:human
          gh pr ready "$PR" --repo "$REPO"
          printf '%s\n\n%s\n' \
            "Escalated without review — this diff carries authority an agent may not self-approve (ADR 0006)." \
            "$REASONS" > "$RUNNER_TEMP/body.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"

      - uses: actions/setup-node@v7
        if: steps.verdict.outputs.go == 'true'
        with:
          node-version: 22
      # Pi, the two binaries its grep and find tools need, and models.json where
      # Pi reads it. All asserted, because each fails silently otherwise.
      #
      # - ripgrep and fd are not on the Ubuntu runner (runner-images' Ubuntu
      #   24.04 readme), and PI_OFFLINE=1 stops Pi downloading them
      #   (tools-manager.js). Without them Pi's grep and find tools fail for
      #   every role (`NOTES.md` 76). Ubuntu's fd is `fdfind`, which Pi looks for.
      # - Pi reads models.json only from ~/.pi/agent, never from a project's
      #   .pi/. Until 2026-09-18 no role's sampling or routing reached the wire
      #   (`NOTES.md` 72). And a model missing from Pi's catalogue silently runs
      #   as a copy of another model, with none of its settings.
      - name: Install Pi, its search tools and its model config
        if: steps.verdict.outputs.go == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ vars.GATEKEEP_MODEL }}
        run: |
          npm install -g @earendil-works/pi-coding-agent
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep fd-find > /dev/null
          command -v rg > /dev/null && command -v fdfind > /dev/null \
            || { echo "::error::ripgrep or fd is missing, so Pi's grep and find tools would fail"; exit 1; }
          mkdir -p ~/.pi/agent
          cp .pi/models.json ~/.pi/agent/models.json
          pi --list-models openrouter < /dev/null > "$RUNNER_TEMP/models.txt" 2>&1 || true
          grep -qF -- "$MODEL" "$RUNNER_TEMP/models.txt" \
            || { echo "::error::Pi does not know $MODEL. It would run as a copy of another model, with none of its settings (NOTES.md 72). Declare it under models in .pi/models.json."; exit 1; }
          echo "Pi knows $MODEL; ripgrep and fd are installed"

      - name: Merge or escalate
        if: steps.verdict.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          REVIEWED: ${{ steps.verdict.outputs.reviewed }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          SHA: ${{ needs.triage.outputs.sha }}
          STILL: ${{ github.workspace }}/scripts/still-current.sh
          # This role registers no submit tool, and says so on stderr. Its
          # finish is a merge or an escalation — both `gh` calls the driver's
          # --done check can see directly.
          PI_ROLE: gatekeeper
          PI_OFFLINE: "1"
        run: |
          # Refuse to run an agent with no role instructions. `--skill` used to
          # fail silently here and two runs went out with none (`NOTES.md` 25).
          test -s .agents/gatekeeper.md \
            || { echo "::error::.agents/gatekeeper.md is missing or empty"; exit 1; }
          test -s .agents/nudge-gatekeeper.md \
            || { echo "::error::.agents/nudge-gatekeeper.md is missing or empty"; exit 1; }
          test -x scripts/pi-driver.py \
            || { echo "::error::scripts/pi-driver.py missing from the sparse checkout"; exit 1; }
          # Extensions are auto-discovered, so a missing one is silent. This
          # job checked none of them until 2026-09-18 (`NOTES.md` 81).
          for f in protect.ts sanity.ts permission-gate.ts; do
            test -s ".pi/extensions/$f" \
              || { echo "::error::.pi/extensions/$f missing from the sparse checkout"; exit 1; }
          done
          test -s AGENTS.md \
            || { echo "::error::AGENTS.md is not in the checkout — this role is told to read it"; exit 1; }
          echo "role instructions: $(wc -c < .agents/gatekeeper.md) bytes"

          # STATE THE VERDICT. This job already computed it above, and until
          # 2026-09-17 it threw it away — so the role re-derived it from the
          # thread and then re-justified it on every turn, spending 4,263
          # output tokens to make one decision and write no code
          # (`NOTES.md` 51). A fact in the prompt costs
          # nine words; a fact the model must infer costs it every turn.
          cat > "$RUNNER_TEMP/prompt.md" <<PROMPT
          Decide whether pull request #$PR in $REPO merges to develop.

          These are established. Do not re-derive them:

          - The reviewer's verdict is **$VERDICT**.
          - It was submitted against commit $REVIEWED, which is the head.

          Your judgement is whether the change is confined to the scope of the
          issue it closes — not what the reviewer decided.

          If you merge, pin the merge to that commit:

              gh pr merge $PR --repo $REPO --match-head-commit $REVIEWED

          GitHub then refuses the merge itself if the head has moved since the
          review, so the commit that merges is always the commit that was read.

          There is no third ending: it merges, or it is labelled for a human.
          PROMPT

          # The driver, for the same reason the implementer has one: `pi` exits
          # 0 when the task fails (`NOTES.md` 1). On 2026-09-15 this step's
          # model died on three consecutive provider 429s and the step still
          # reported success — the only reason anyone noticed was the safety net
          # below. The driver makes that a red step, and gives the agent another
          # turn before it gets there.
          #
          # The predicate is the SAME script the safety net runs, so "finished"
          # means one thing in this job, not two.
          # --no-skills: the human skills in .agents/skills/ (`0015`) are for people's
          # harnesses. Pi discovers that directory by itself, and without the flag
          # every role would carry them in its system prompt on every run.
          # --provider openrouter: `--model` reads `provider/id`, so a model whose
          # prefix is also a Pi provider (`deepseek/`, `google/`, `openai/`) goes to
          # that provider instead, and dies asking for its key (`NOTES.md` 70).
          python3 scripts/pi-driver.py \
            --prompt-file "$RUNNER_TEMP/prompt.md" \
            --nudge-file .agents/nudge-gatekeeper.md \
            --done "bash $RUNNER_TEMP/gatekeeper-done.sh" \
            --max-nudges 2 \
            --idle-timeout 300 \
            --timeout 900 \
            --log "$RUNNER_TEMP/rpc.jsonl" \
            -- pi --mode rpc --approve --no-skills --provider openrouter \
                  --append-system-prompt "$(cat .agents/gatekeeper.md)" \
                  --model "${{ vars.GATEKEEP_MODEL }}" \
                  --tools read,grep,find,ls,bash

      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpc-gatekeeper-pr-${{ needs.triage.outputs.number }}
          path: ${{ runner.temp }}/rpc.jsonl
          if-no-files-found: warn
          retention-days: 7

      # Silence is the one outcome not allowed. On the Hermes rig a reviewer
      # twice decided privately that a human should handle something and then
      # stopped, which from GitHub is indistinguishable from a clean merge.
      - name: No silent outcomes
        if: always() && needs.triage.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.triage.outputs.number }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.triage.outputs.sha }}
          STILL: ${{ github.workspace }}/scripts/still-current.sh
        run: |
          # The same predicate the driver used. One definition of "has an
          # outcome", and it counts a queued merge as one — see the step that
          # writes it.
          if bash "$RUNNER_TEMP/gatekeeper-done.sh"; then
            exit 0
          fi

          # GitHub may have refused the merge because develop moved under us
          # while this job was running. That is rework, not a human's problem.
          if [ "$(gh pr view "$PR" --repo "$REPO" --json mergeable -q '.mergeable')" = "CONFLICTING" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label needs:rework
            gh pr comment "$PR" --repo "$REPO" \
              --body "GitHub refused the merge: conflicts with develop. Back to the implementer (ADR 0009)."
            exit 0
          fi

          gh pr edit "$PR" --repo "$REPO" --add-label needs:human
          gh pr comment "$PR" --repo "$REPO" \
            --body "The gatekeeper ended without merging or escalating. A human should look. $RUN"
