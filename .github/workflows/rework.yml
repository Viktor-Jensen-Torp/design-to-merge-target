# The rework loop. One door back to the implementer — ADR 0009.
#
# Fires when a pull request is labelled `needs:rework`, whatever put it there:
#   triage      — CI came back red
#   the gatekeeper — the reviewer returned `rework`, or GitHub refused the merge
#
# The label is applied by an App token, so the event chains. A GITHUB_TOKEN
# label would not trigger anything at all (NOTES.md section 6).
#
# Goes in the TARGET repo at .github/workflows/rework.yml.

name: Rework

on:
  pull_request:
    types: [labeled]

# One rework at a time per pull request. Two concurrent runs would push over
# each other on the same branch.
#
# KNOWN GAP (VERIFY.md S10): if a third trigger arrives, GitHub cancels the
# pending run and `needs:rework` is left on the pull request with nothing
# listening. A label is state; an event is not. The sweeper that closes this
# is not built.
concurrency:
  group: rework-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rework:
    if: github.event.label.name == 'needs:rework'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.IMPLEMENTER_CLIENT_ID }}
          private-key: ${{ secrets.IMPLEMENTER_APP_PRIVATE_KEY }}

      # ADR 0009 — three CONSECUTIVE strikes, and a separate budget for lost
      # races with develop. Labels are the only state that survives a run, and
      # unlike the run log they are visible on the pull request.
      - name: Count the strike
        id: count
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # One read for both. Two `gh pr view` calls where one will do is the
          # cheapest kind of waste to avoid.
          PRJSON=$(gh pr view "$PR" --repo "$REPO" --json labels,mergeable)
          LABELS=$(jq -r '.labels[].name'  <<< "$PRJSON")
          CONFLICTED=$(jq -r '.mergeable'  <<< "$PRJSON")

          # Whose fault is it? A conflict is not the implementer getting it
          # wrong, so it spends the conflict budget, never a strike.
          if [ "$CONFLICTED" = "CONFLICTING" ]; then
            KIND=conflict; LIMIT=3; TASK=resolve-conflict
          else
            KIND=strike;   LIMIT=3; TASK=unknown
          fi

          N=0
          for i in 1 2 3 4 5; do
            grep -qx "$KIND:$i" <<< "$LABELS" && N=$i
          done
          N=$((N + 1))

          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "n=$N"       >> "$GITHUB_OUTPUT"

          if [ "$N" -ge "$LIMIT" ]; then
            gh pr edit "$PR" --repo "$REPO" \
              --add-label needs:human --remove-label needs:rework
            gh pr ready "$PR" --repo "$REPO"
            gh pr comment "$PR" --repo "$REPO" --body \
              "Third consecutive $KIND. A human owns this now (ADR 0009)."
            echo "stop=true" >> "$GITHUB_OUTPUT"
          else
            gh pr edit "$PR" --repo "$REPO" --add-label "$KIND:$N"
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

      # Work on the pull request's own branch, not develop.
      - uses: actions/checkout@v5
        if: steps.count.outputs.stop == 'false'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Arm the local gates
        if: steps.count.outputs.stop == 'false'
        run: |
          git config core.hooksPath .githooks
          test "$(git config core.hooksPath)" = ".githooks"

      # Assemble what the implementer is given. ADR 0009: the named task matters
      # as much as the counter — an agent told "try again" re-reads the issue and
      # reimplements; one told "resolve this conflict, here are both sides" does
      # the job in front of it.
      - name: Gather the context
        id: ctx
        if: steps.count.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TASK: ${{ steps.count.outputs.task }}
        run: |
          # The findings are in REVIEWS, not comments. `0012` moved the verdict
          # into a pull request review, and `gh pr view --json comments` does not
          # return review bodies — so this step handed the agent an empty
          # findings section, it had nothing to act on, and the run was wasted
          # and escalated (`NOTES.md` 39). Both are read: the reviews carry the
          # findings, the comments carry everything a human or another job said.
          {
            echo "## The pull request"
            gh pr view "$PR" --repo "$REPO" --json title,body -q '.title + "\n\n" + .body'
            echo
            echo "## The reviews"
            gh api "repos/$REPO/pulls/$PR/reviews" \
              --jq '.[] | select(.state != "PENDING")
                    | "— " + .user.login + " (" + .state + ", on " + .commit_id[0:7] + "):\n" + (.body // "(no body)")'
            echo
            echo "## The thread"
            gh pr view "$PR" --repo "$REPO" --json comments \
              -q '.comments[] | "— " + .author.login + ":\n" + .body'
          } > "$RUNNER_TEMP/context.md"

          # Assert it. An empty context file is how this failed the first time,
          # and it looked exactly like an agent that would not work.
          test -s "$RUNNER_TEMP/context.md" \
            || { echo "::error::the context file is empty — refusing to rework with no brief"; exit 1; }
          echo "context: $(wc -c < "$RUNNER_TEMP/context.md") bytes"

          if [ "$TASK" = "resolve-conflict" ]; then
            git fetch origin develop
            echo "task=Rebase this branch onto origin/develop and resolve the conflicts." \
              >> "$GITHUB_OUTPUT"
          else
            # Not a conflict, so it is CI or the reviewer. The run log says which.
            RUN=$(gh run list --repo "$REPO" --branch "${{ github.event.pull_request.head.ref }}" \
                    --workflow CI --limit 1 --json conclusion,databaseId \
                    --jq '.[0] | select(.conclusion=="failure") | .databaseId')
            if [ -n "$RUN" ]; then
              echo "## The failing CI job" >> "$RUNNER_TEMP/context.md"
              gh run view "$RUN" --repo "$REPO" --log-failed >> "$RUNNER_TEMP/context.md" 2>/dev/null || true
              echo "task=Make CI pass. The failing job log is in the context file." >> "$GITHUB_OUTPUT"
            else
              echo "task=Address the findings in the reviews." >> "$GITHUB_OUTPUT"
            fi
          fi

      # Guarded like everything after `Count the strike`: on the stop path
      # there is no checkout, so `git config` here has no repository to write to
      # and the step dies — turning a CORRECT third-strike escalation into a red
      # run, with the `Escalate` step below guarded off so nothing explains it.
      # Never fired, because no pull request has reached three consecutive
      # strikes. Latent, like the `top_p` trap in `NOTES.md` 46.
      #
      # The agent commits, so git needs an identity. Without one its first
      # `git commit` fails with "Author identity unknown", and on 2026-09-16 the
      # implementer recovered by inventing one — every commit on that branch is
      # authored by `Agent <you@example.com>` (`NOTES.md` 45). The work was
      # right and the authorship was a placeholder, which is worse than a
      # failure: it is wrong and it looks fine.
      #
      # The App's own bot identity is the honest answer. It is what GitHub
      # attributes the push to anyway, and it makes `git log` say which role
      # wrote a commit.
      - name: Give the agent the App's identity
        if: steps.count.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id) \
            || { echo "::error::could not resolve the bot user id for ${SLUG}"; exit 1; }
          git config user.name  "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          echo "commits will be authored by ${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>"

      - uses: actions/setup-node@v7
        if: steps.count.outputs.stop == 'false'
        with:
          node-version: 22
      - name: Install Pi
        if: steps.count.outputs.stop == 'false'
        run: npm install -g @earendil-works/pi-coding-agent

      # Same stack-specific block as implement.yml, and for the same reason:
      # an agent that cannot run the gates will try to install its way to them.
      - uses: pnpm/action-setup@v6
        if: steps.count.outputs.stop == 'false'
      - run: pnpm install --frozen-lockfile
        if: steps.count.outputs.stop == 'false'

      - name: Rework
        if: steps.count.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Same tool as the implementer — this role commits to the same branch
          # and finishes the same way.
          PI_ROLE: rework
          PI_BASE_REF: origin/develop
          PI_OFFLINE: "1"
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Same role, same skill file. Only the task differs — this is not a
          # second implementer with its own instructions to drift from the first.
          # Refuse to run an agent with no role instructions. `--skill` used to
          # fail silently here and two runs went out with none (`NOTES.md` 25).
          test -s .agents/implementer.md \
            || { echo "::error::.agents/implementer.md is missing or empty"; exit 1; }
          test -s .agents/nudge-implementer.md \
            || { echo "::error::.agents/nudge-implementer.md is missing or empty"; exit 1; }
          test -x scripts/pi-driver.py \
            || { echo "::error::scripts/pi-driver.py is missing"; exit 1; }
          test -s .pi/extensions/submit.ts \
            || { echo "::error::.pi/extensions/submit.ts missing — the role is told to call submit_implementation"; exit 1; }
          test -s .pi/extensions/protect.ts \
            || { echo "::error::.pi/extensions/protect.ts missing — the root of trust is unguarded in-loop"; exit 1; }
          test -s .pi/extensions/sanity.ts \
            || { echo "::error::.pi/extensions/sanity.ts missing — corrupted tool arguments would go unnoticed"; exit 1; }
          test -s .pi/extensions/debug.ts \
            || { echo "::error::.pi/extensions/debug.ts missing"; exit 1; }
          python3 --version >/dev/null \
            || { echo "::error::no python3 for the driver"; exit 1; }
          echo "role instructions: $(wc -c < .agents/implementer.md) bytes"

          # A prompt carries what the role file cannot know, and nothing else
          # (`NOTES.md` 57). It used to open "following .agents/implementer.md",
          # and naming a path is an instruction to go and get it — a wasted turn
          # fetching a file already in the system prompt. The other three
          # prompts were fixed on 2026-09-17; this one is the fourth workflow
          # and was missed for the reason `NOTES.md` 39 gives: rework is the
          # implementer in a second file.
          cat > "$RUNNER_TEMP/prompt.md" <<PROMPT
          Rework pull request #$PR in $REPO.

          ${{ steps.ctx.outputs.task }}

          Everything you need — the plan, the reviews, and any failing job log —
          is in $RUNNER_TEMP/context.md. Read it first.

          Commit your work. Do not push; the workflow does that. If the plan in
          the pull request body is now wrong, say so in your final message.
          PROMPT

          # WHEN IS A REWORK FINISHED? A clean tree AND a commit beyond what is
          # already on the remote branch. "Clean tree" alone is true the moment
          # the job checks out, so on its own it gates nothing (`NOTES.md` 27).
          cat > "$RUNNER_TEMP/done.sh" <<'DONE'
          # Asking for a human is a valid ending, not a failure — see
          # implement.yml. An agent that has decided it needs a decision it is
          # not allowed to make must not be nudged twice and then failed.
          if [ -s "$RUNNER_TEMP/needs-human.md" ]; then
            echo "The agent asked for a human."
            exit 0
          fi
          st=$(git status --porcelain)
          ahead=$(git rev-list --count "origin/$HEAD_REF"..HEAD)
          [ -n "$st" ] && { echo "Uncommitted changes in the working tree:"; echo "$st"; }
          [ "$ahead" = 0 ] && echo "No new commits beyond origin/$HEAD_REF — the rework produced nothing yet."
          [ -z "$st" ] && [ "$ahead" -gt 0 ]
          DONE

          # The driver, for the reason the other three roles have one and this
          # one did not. On 2026-09-16 the rework agent stopped without
          # committing, `pi` exited 0, and "Assert something changed" caught it
          # afterwards — which costs the whole run and escalates a pull request
          # that only needed another turn (`NOTES.md` 39).
          # --no-skills: the human skills in .agents/skills/ (`0015`) are for people's
          # harnesses. Pi discovers that directory by itself, and without the flag
          # every role would carry them in its system prompt on every run.
          # --provider openrouter: `--model` reads `provider/id`, so a model whose
          # prefix is also a Pi provider (`deepseek/`, `google/`, `openai/`) goes to
          # that provider instead, and dies asking for its key (`NOTES.md` 70).
          python3 scripts/pi-driver.py \
            --prompt-file "$RUNNER_TEMP/prompt.md" \
            --nudge-file .agents/nudge-implementer.md \
            --done "bash $RUNNER_TEMP/done.sh" \
            --max-nudges 2 \
            --idle-timeout 600 \
            --timeout 2280 \
            --log "$RUNNER_TEMP/rpc.jsonl" \
            -- pi --mode rpc --approve --no-skills --provider openrouter \
                  --append-system-prompt "$(cat .agents/implementer.md)" \
                  --model "${{ vars.REWORK_MODEL }}"

      # "Assert something changed" used to live here, running the same check
      # after the fact. The driver now runs it while the agent can still act on
      # it, and a check written in two places is a check that will eventually
      # disagree with itself.

      # The implementer's escalate verb, on a pull request rather than an issue.
      # `0006`: silence is never an outcome. An agent that stops deliberately
      # and one that breaks used to be indistinguishable here too.
      - name: Did the agent ask for a human?
        id: askhuman
        if: steps.count.outputs.stop == 'false'
        run: |
          if [ -s "$RUNNER_TEMP/needs-human.md" ]; then
            echo "asked=true" >> "$GITHUB_OUTPUT"
            echo "the agent asked for a human: $(wc -c < "$RUNNER_TEMP/needs-human.md") bytes"
          else
            echo "asked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand it to a human
        if: steps.askhuman.outputs.asked == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The implementer stopped reworking this and asked for a human. Its reason:"
            echo
            sed 's/^/> /' "$RUNNER_TEMP/needs-human.md"
            echo
            echo "A deliberate stop, not a failed run — it spends no strike. $RUN"
          } > "$RUNNER_TEMP/handover.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/handover.md"
          gh pr edit "$PR" --repo "$REPO" --add-label needs:human --remove-label needs:rework
          gh pr ready "$PR" --repo "$REPO" || true
          echo "pull request #$PR -> needs:human"

      - name: Publish
        if: steps.count.outputs.stop == 'false' && steps.askhuman.outputs.asked != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git push --force-with-lease origin "HEAD:$BRANCH"

          # A commit is not delivered until it is on the remote.
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "$BRANCH" | cut -f1)
          test "$LOCAL" = "$REMOTE" || { echo "push did not land"; exit 1; }

          # The label comes off only once the work is actually on the remote.
          # Removing it earlier would lose the pull request if this step failed.
          gh pr edit "$PR" --repo "$REPO" --remove-label needs:rework
          gh pr comment "$PR" --repo "$REPO" \
            --body "Reworked: ${{ steps.ctx.outputs.task }}
          Now at \`$LOCAL\`. CI and review will run again."

      - name: Escalate
        if: failure() && steps.count.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --add-label needs:human --remove-label needs:rework
          gh pr ready "$PR" --repo "$REPO"
          gh pr comment "$PR" --repo "$REPO" --body "The rework run itself failed. $RUN"
