# Closes the issues a release actually shipped, and clears `in:develop`.
#
# ADR 0011: `Done` means merged to `main`.
#
# It derives the list from the COMMIT RANGE, not by sweeping the `in:develop`
# label. Sweeping would be wrong whenever `develop` has moved on since `staging`
# was cut: those issues carry the label but are not in this release, and closing
# them would report work as shipped that is still sitting in `develop`.
#
# This depends on the two merge methods being DIFFERENT, deliberately:
#
#   develop <- agent pull request   SQUASH         one issue is one commit, so a
#                                                  release can drop one (`0011`)
#   staging <- develop              MERGE COMMIT   the squash subjects survive,
#   main    <- staging              MERGE COMMIT   so `(#n)` is still readable
#
# A squashed release collapses every `(#n)` into the release's own number and
# this workflow cannot work. It fails loudly rather than closing nothing.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Close everything this release shipped
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A new branch or a force-push gives an all-zero or unreachable base.
          # Guessing a range here would close the wrong issues.
          if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::error::push carried no usable base ($BEFORE) — refusing to guess a range"
            exit 1
          fi

          PRS=$(git log --format=%s "$BEFORE..$AFTER" \
                 | sed -n 's/.*(#\([0-9][0-9]*\))[[:space:]]*$/\1/p' | sort -un)

          if [ -z "$PRS" ]; then
            echo "::error::no (#n) subjects in $BEFORE..$AFTER"
            echo "::error::Was the release squashed? It has to be a merge commit — see this file's header."
            exit 1
          fi
          echo "pull requests in this release: $(echo $PRS | tr '\n' ' ')"

          # GitHub does NOT create a closing-issue link for a pull request whose
          # base is not the DEFAULT branch, so `closingIssuesReferences` comes
          # back empty here even when the body says `Closes #n`
          # (`NOTES.md` section 19 — established by running it, not by reading).
          # So parse the body, skipping fenced code blocks, and accept every
          # keyword GitHub itself accepts.
          parse_closes() {
            awk '/^[[:space:]]*```/{f=!f; next} !f' \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -un
          }

          # Map pull requests to the issues they closed. The release pull
          # request itself appears here and normally closes nothing; that is
          # fine, it contributes no issues.
          ISSUES=""
          for P in $PRS; do
            FOUND=$(gh pr view "$P" --json body -q .body 2>/dev/null | parse_closes || true)
            HEAD=$(gh pr view "$P" --json headRefName -q .headRefName 2>/dev/null || true)
            case "$HEAD" in agent/issue-*) FOUND="$FOUND ${HEAD##*issue-}" ;; esac
            [ -n "$FOUND" ] && ISSUES="$ISSUES $FOUND"
          done
          ISSUES=$(echo "$ISSUES" | tr ' ' '\n' | grep -v '^$' | sort -un || true)

          if [ -z "$ISSUES" ]; then
            echo "::warning::this release closed no issues — a docs or chore release?"
            exit 0
          fi

          for N in $ISSUES; do
            STATE=$(gh issue view "$N" --json state -q .state)
            if [ "$STATE" = "CLOSED" ]; then
              echo "issue #$N already closed — leaving it"
            else
              gh issue close "$N" --reason completed \
                --comment "Released to \`main\` in ${SHA}. (ADR 0011: \`Done\` means merged to \`main\`.)"
              echo "issue #$N -> closed"
            fi
            gh issue edit "$N" --remove-label "in:develop" 2>/dev/null || true
          done

          # Assert the outcome. A close that silently failed leaves the board
          # claiming work is still in flight after it shipped.
          for N in $ISSUES; do
            [ "$(gh issue view "$N" --json state -q .state)" = "CLOSED" ] \
              || { echo "::error::issue #$N is still open after the release"; exit 1; }
          done

          # What is left. This subtracts the issues just closed rather than
          # re-querying: `gh issue list` reads an index that lags a close by a
          # few seconds, and would report work as unreleased immediately after
          # releasing it.
          echo "Merged to develop, not yet released:"
          gh issue list --label "in:develop" --state open --json number,title \
            -q '.[] | "\(.number) \(.title)"' \
            | while read -r NUM TITLE; do
                printf '%s\n' "$ISSUES" | grep -qx "$NUM" || echo "  #$NUM $TITLE"
              done
